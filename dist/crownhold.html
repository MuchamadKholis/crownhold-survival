        '<div class="enemy-row">' + types.map(t => '<canvas title="' + esc(CH.ENEMIES[t].name) + '" data-unit="' + CH.ENEMIES[t].sprite + '" data-size="' + Math.min(16, CH.ENEMIES[t].size) + '"></canvas>').join('') + '</div>' +
        '<div class="sc-meta"><span>' + st.waves.length + ' waves</span><span>' + icon('gold') + st.startGold + ' battle gold</span>' + (st.timeLimit ? '<span>' + icon('time') + U.time(st.timeLimit) + '</span>' : '') + '</div>' +
        '<div class="sc-reward"><span class="label">' + (got ? 'Replay reward' : 'First clear') + '</span>' + UI.reward(rw) + (!got && st.reward.gems ? '' : '') + (got < 3 ? '<span class="chip">' + icon('gems') + '+2 for 3 stars</span>' : '') + '</div>' +
        (open ? '<button class="btn btn-gold btn-block" data-act="play" data-id="' + st.id + '">' + (got ? 'Play again' : 'Defend') + '</button>' : '<button class="btn btn-block" disabled>' + icon('lock') + 'Clear the previous stage</button>') +
        '</div></article>';
    }).join('');
    return {
      title: reg.name,
      html: '<p class="lead">' + reg.sub + '. Towers you build here use your kingdom\'s defense levels, so upgrading at home makes you stronger in the campaign.</p><div class="stage-grid">' + list + '</div>',
      on: { play: b => { const [rr, kk] = b.dataset.id.split('-').map(Number); CH.App.startBattle({ mode: 'campaign', stage: CH.Campaign.stage(rr, kk) }); } },
    };
  }

  /* ---------------- Endless ---------------- */
  function endless() {
    const s = save(), cl = S.castleLevel(s), locked = cl < 2;
    const ms = CH.Defense.MILESTONES.find(m => !s.defense.claimed.includes(m.wave));
    return {
      title: 'Endless Battle',
      html: '<p class="lead">Two different wars. In a <b>raid</b> you attack AI-controlled enemy kingdoms. In a <b>defense</b>, endless AI armies attack your own base, exactly as you built it. (Opponents are computer-generated; there is no online multiplayer.)</p>' +
        '<div class="mode-grid">' +
        '<button class="mode-card raid" data-act="raid"' + (locked ? ' disabled' : '') + '>' + icon('swords') + '<h3>Endless Raid</h3><p>Choose an enemy kingdom, scout its defenses and loot, deploy troops and heroes, and steal its resources.</p>' +
        '<div class="mode-stats"><span>' + icon('trophy') + s.raid.trophies + ' trophies · ' + CH.Raid.league(s.raid.trophies) + ' league</span><span>' + s.raid.wins + ' raids won</span></div>' + (locked ? '<span class="req">' + icon('lock') + 'Castle level 2 required</span>' : '') + '</button>' +
        '<button class="mode-card defense" data-act="defense"' + (locked ? ' disabled' : '') + '>' + icon('shield') + '<h3>Endless Defense</h3><p>Wave after wave attacks your kingdom from every side. Pick a blessing every 5 waves. Survive as long as you can.</p>' +
        '<div class="mode-stats"><span>' + icon('flag' in UI.ICONS ? 'flag' : 'crown') + 'Best: wave ' + s.defense.best + '</span>' + (ms ? '<span>Next record reward: wave ' + ms.wave + ' (' + icon('gems') + ms.gems + ')</span>' : '') + '</div>' + (locked ? '<span class="req">' + icon('lock') + 'Castle level 2 required</span>' : '') + '</button></div>',
      on: { raid: () => UI.sheet('raidTargets'), defense: () => defensePrep() },
    };
  }
  function defensePrep() {
    const s = save(), heroes = CH.HERO_ORDER.filter(h => s.heroes[h].unlocked);
    UI.modal('<h3>Endless Defense</h3><p>Your real base layout is the battlefield. Enemies come from every side; walls and traps matter. Your heroes and army can join the defense. Rewards are banked each wave and paid when the run ends.</p>' +
      '<ul class="bullets"><li>Wave 10: mini-boss. Wave 20: boss. After 20, waves gain random modifiers.</li><li>Every 5 waves, choose a blessing: repairs, damage boosts and more.</li><li>Best so far: wave ' + s.defense.best + '</li></ul>' +
      '<p class="muted">' + (heroes.length ? 'Heroes ready: ' + heroes.map(h => CH.HEROES[h].name).join(', ') : 'Recruit heroes in the Hero Hall to bring them along.') + ' · Army: ' + S.armySize(s) + ' troops</p>' +
      '<button class="btn btn-gold btn-lg btn-block" data-go>Defend my kingdom</button>', { onClick: e => { if (e.target.closest('[data-go]')) { UI.closeModal(); CH.App.startBattle({ mode: 'defense' }); } } });
  }

  function raidTargets() {
    const s = save();
    if (!s.raid.opponents.length) { CH.Raid.refresh(s); persist(); }
    const cards = s.raid.opponents.map(op => {
      UI.painters['op' + op.id] = cv => CH.View.layoutPreview(cv, op.layout, { cl: op.cl, area: areaFor(op.cl) });
      const defs = op.layout.filter(b => B[b.type].cat === 'defense').length;
      return '<article class="op-card"><canvas data-paint="op' + op.id + '"></canvas><div class="op-body">' +
        '<div class="op-top"><span class="kicker">' + op.archName + '</span><span class="tag">Castle ' + op.cl + '</span></div>' +
        '<h3>' + esc(op.name) + '</h3><p class="muted">' + esc(op.lord) + ' · ' + op.archDesc + '</p>' +
        '<div class="loot-row"><span class="label">Available loot</span>' + UI.reward({ gold: op.loot.gold, wood: op.loot.wood, stone: op.loot.stone, gems: op.loot.gems }) + '</div>' +
        '<div class="op-meta"><span>' + defs + ' defenses</span><span>' + op.layout.filter(b => b.type === 'wall').length + ' walls</span><span>' + icon('trophy') + '+' + Math.max(5, op.trophyWin) + ' / −' + op.trophyLoss + '</span></div>' +
        '<button class="btn btn-gold btn-block" data-act="scout" data-id="' + op.id + '">Scout and attack</button></div></article>';
    }).join('');
    const cost = CH.Raid.searchCost(S.castleLevel(s));
    return {
      title: 'Choose a target',
      html: '<div class="row-between"><p class="lead">Each kingdom can be raided once. Loot is split across its vaults, mines and castle; you take a share of everything you damage.</p><button class="btn" data-act="search">Find new kingdoms ' + UI.cost({ gold: cost }, s) + '</button></div><div class="op-grid">' + cards + '</div>',
      on: {
        scout: b => UI.sheet('raidPrep', b.dataset.id),
        search: () => { if (s.res.gold < cost) return fail({ reason: 'Not enough gold' }); s.res.gold -= cost; CH.Raid.refresh(s); persist(); UI.refreshSheet(); },
      },
    };
  }
  function areaFor(cl) { const [w, h] = CH.CONFIG.AREA[cl - 1]; return { x: Math.floor((CH.CONFIG.COLS - w) / 2), y: Math.floor((CH.CONFIG.ROWS - h) / 2), w, h }; }
  function raidPrep(id) {
    const s = save(), op = s.raid.opponents.find(o => o.id === id);
    if (!op) return raidTargets();
    UI.painters['big' + op.id] = cv => CH.View.layoutPreview(cv, op.layout, { cl: op.cl, area: areaFor(op.cl) });
    const army = CH.TROOP_ORDER.filter(t => s.army[t] > 0);
    const heroes = CH.HERO_ORDER.filter(h => s.heroes[h].unlocked);
    const spells = CH.SPELL_ORDER.filter(sp => S.spellUnlocked(s, sp));
    return {
      title: esc(op.name),
      html: '<div class="prep"><canvas class="prep-map" data-paint="big' + op.id + '"></canvas><div class="prep-side panel">' +
        '<span class="kicker">' + op.archName + ' · Castle ' + op.cl + '</span><h3>' + esc(op.lord) + '</h3>' +
        '<div class="loot-row"><span class="label">Estimated loot</span>' + UI.reward(op.loot) + '</div>' +
        '<p class="muted">Stars: 50% destroyed, the castle destroyed, 100% destroyed. One star is a victory. Traps are hidden. You have 3 minutes.</p>' +
        '<h4>Your army</h4>' + (army.length ? '<div class="army-row">' + army.map(t => '<span class="unit-chip"><canvas data-unit="' + CH.TROOPS[t].sprite + '" data-size="' + CH.TROOPS[t].size + '"></canvas><b>×' + s.army[t] + '</b></span>').join('') + '</div>' : '<p class="warn">You have no troops. Train some in the Army screen.</p>') +
        (heroes.length ? '<h4>Heroes</h4><div class="army-row">' + heroes.map(h => '<span class="unit-chip hero"><canvas data-unit="' + CH.HEROES[h].sprite + '" data-size="' + CH.HEROES[h].size + '"></canvas><b>' + CH.HEROES[h].name.split(' ').pop() + '</b></span>').join('') + '</div>' : '') +
        (spells.length ? '<h4>Spells</h4><div class="army-row">' + spells.map(sp => '<span class="chip">' + icon(sp) + CH.SPELLS[sp].name + ' ×' + CH.SPELLS[sp].charges + '</span>').join('') + '</div>' : '') +
        '<div class="row"><button class="btn" data-act="army">Train troops</button><button class="btn btn-gold btn-lg" data-act="attack"' + (army.length || heroes.length ? '' : ' disabled') + '>Attack!</button></div></div></div>',
      on: { attack: () => CH.App.startBattle({ mode: 'raid', opponent: op }), army: () => UI.sheet('army') },
    };
  }

  /* ---------------- Army ---------------- */
  function army() {
    const s = save(), cap = S.housingCap(s), used = S.housingUsed(s), bl = S.barracksLevel(s);
    const cards = CH.TROOP_ORDER.map(t => {
      const d = CH.TROOPS[t], lvl = s.research.troops[t], locked = bl < d.unlock, why = S.trainBlocker(s, t), m = CH.RESEARCH.troopMult(lvl);
      return '<div class="troop-card' + (locked ? ' locked' : '') + '"><canvas data-unit="' + d.sprite + '" data-size="' + d.size + '" data-bg="120,170,255"></canvas>' +
        '<div class="tc-body"><div class="tc-top"><b>' + d.name + '</b><span class="tag">' + d.cls + '</span></div>' +
        '<span class="muted">Level ' + lvl + ' · ' + d.housing + ' space · ' + (d.flying ? 'Flying · ' : '') + (d.target === 'defense' ? 'Targets defenses' : d.proj ? 'Ranged' : 'Melee') + '</span>' +
        '<span class="tc-stats">❤ ' + U.fmt(d.hp * m) + ' · ⚔ ' + U.fmt(d.dmg * m) + (d.splash ? ' area' : '') + '</span>' +
        '<span class="desc">' + d.desc + '</span>' +
        (locked ? '<span class="req">' + icon('lock') + 'Barracks level ' + d.unlock + '</span>' :
          '<div class="tc-buy"><span class="have">Owned ' + (s.army[t] || 0) + '</span><button class="btn btn-gold" data-act="train" data-t="' + t + '"' + (why ? ' disabled title="' + why + '"' : '') + '>Train ' + icon('gold') + d.cost + ' · ' + d.time + 's</button></div>') +
        '</div></div>';
    }).join('');
    const queue = s.train.map((q, i) => '<button class="q-item" data-act="cancel" data-i="' + i + '" title="Cancel and refund"><canvas data-unit="' + CH.TROOPS[q.type].sprite + '" data-size="' + CH.TROOPS[q.type].size + '"></canvas>' + (i === 0 ? '<i style="width:' + Math.round((1 - q.left / CH.TROOPS[q.type].time) * 100) + '%"></i>' : '') + '</button>').join('');
    const left = s.train.reduce((a, q) => a + q.left, 0);
    return {
      title: 'Army',
      html: (bl ? '' : '<p class="warn">Build a Barracks to train troops.</p>') +
        '<div class="army-head panel"><div><span class="label">Army space</span><div class="bar big"><i style="width:' + (cap ? Math.min(100, used / cap * 100) : 0) + '%"></i></div><b>' + used + ' / ' + cap + '</b> (including the queue)</div>' +
        '<div class="queue"><span class="label">Training queue ' + (s.train.length ? '· ' + U.time(left) : '(empty)') + '</span><div class="q-row">' + queue + '</div></div>' +
        (s.train.length ? '<button class="btn btn-gem" data-act="finish">Finish now ' + icon('gems') + Math.max(1, Math.ceil(left / 20)) + '</button>' : '') + '</div>' +
        '<p class="muted">Troops you deploy in battle are used up. Training continues while you are away.</p><div class="troop-grid">' + cards + '</div>',
      on: {
        train: b => { const r = S.train(s, b.dataset.t); if (!r.ok) return fail(r); CH.Audio.play('deploy'); persist(); UI.refreshSheet(); },
        cancel: b => { S.cancelTrain(s, +b.dataset.i); persist(); UI.refreshSheet(); },
        finish: () => { if (!S.finishTrainingNow(s)) return fail({ reason: 'Not enough gems' }); persist(); UI.refreshSheet(); },
      },
    };
  }

  /* ---------------- Heroes ---------------- */
  function heroes() {
    const s = save(), hl = S.heroHallLevel(s);
    const cards = CH.HERO_ORDER.map(id => {
      const d = CH.HEROES[id], h = s.heroes[id], why = S.heroBlocker(s, id), m = CH.State.heroMult(h.level);
      const next = h.unlocked ? CH.heroUpgradeCost(h.level + 1) : d.cost;
      return '<article class="hero-card' + (h.unlocked ? '' : ' locked') + '"><canvas data-unit="' + d.sprite + '" data-size="' + d.size + '" data-bg="255,210,120"></canvas>' +
        '<div class="hc-body"><h3>' + d.name + '</h3><p class="kicker">' + d.title + ' · ' + d.role + '</p>' +
        '<p>' + d.desc + '</p><div class="ability"><b>' + d.ability.name + '</b> (' + d.ability.cd + 's cooldown): ' + d.ability.desc + '</div>' +
        '<div class="tc-stats">' + (h.unlocked ? 'Level ' + h.level + ' / ' + S.heroMaxLevel(s) + ' · ' : '') + '❤ ' + U.fmt(d.hp * m) + ' · ⚔ ' + U.fmt(d.dmg * m) + (d.proj ? ' ranged' : '') + '</div>' +
        (hl < d.unlock ? '<span class="req">' + icon('lock') + 'Hero Hall level ' + d.unlock + '</span>' :
          '<button class="btn btn-gold btn-block" data-act="hero" data-id="' + id + '"' + (why ? ' disabled' : '') + '>' + (h.unlocked ? 'Train to level ' + (h.level + 1) : 'Recruit') + ' ' + UI.cost(next, s) + '</button>' + (why && why !== 'Not enough resources' ? '<span class="req">' + why + '</span>' : '')) +
        '</div></article>';
    }).join('');
    return {
      title: 'Heroes',
      html: (hl ? '' : '<p class="warn">Build a Hero Hall (castle level 2) to recruit heroes.</p>') + '<p class="lead">Heroes are never used up. Deploy them in any battle and trigger their ability from the battle bar. Upgrades above level 3 need runes, earned from boss stages and Endless Defense.</p><div class="hero-grid">' + cards + '</div>',
      on: { hero: b => { const r = S.heroAction(s, b.dataset.id); if (!r.ok) return fail(r); CH.Audio.play(r.unlocked ? 'heroDeploy' : 'upgrade'); persist(); UI.refreshSheet(); } },
    };
  }

  /* ---------------- Buildings overview ---------------- */
  function buildings() {
    const s = save(), now = Date.now();
    const groups = CH.BUILD_MENU.concat([{ id: 'core', name: 'Castle', types: ['castle'] }]).reverse();
    const html = groups.map(g => {
      const list = s.buildings.filter(b => g.types.includes(b.type) && b.type !== 'wall');
      if (!list.length) return '';
      return '<h4 class="group">' + g.name + '</h4><div class="b-list">' + list.map(b => {
        const d = B[b.type], why = S.upgradeBlocker(s, b), max = S.maxLevelFor(s, b.type);
        return '<div class="b-row"><canvas data-building="' + b.type + '" data-level="' + Math.max(1, b.level) + '"></canvas><div class="b-info"><b>' + d.name + '</b><span class="muted">Level ' + b.level + ' / ' + max + (b.job ? ' · ' + (b.job.kind === 'clear' ? 'clearing' : 'upgrading') + ' ' + U.time((b.job.ends - now) / 1000) : '') + '</span></div>' +
          (d.maxLevel > 1 && !b.job ? '<button class="btn' + (why ? '' : ' btn-gold') + '" data-act="up" data-id="' + b.id + '"' + (why === 'Maximum level' ? ' disabled' : '') + '>' + (why && why !== 'Not enough resources' ? why : 'Upgrade') + '</button>' : '') +
          '<button class="btn btn-quiet" data-act="show" data-id="' + b.id + '">Show</button></div>';
      }).join('') + '</div>';
    }).join('');
    const walls = s.buildings.filter(b => b.type === 'wall');
    const wallLv = {}; walls.forEach(w => wallLv[w.level] = (wallLv[w.level] || 0) + 1);
    return {
      title: 'Buildings',
      html: '<div class="builders panel">' + icon('hammer') + '<b>' + S.freeBuilders(s) + ' of ' + S.builders(s) + ' builders free.</b> Each Builder Hut is one builder; build more to work faster.</div>' + html +
        '<h4 class="group">Walls</h4><p class="muted">' + walls.length + ' / ' + S.maxCount(s, 'wall') + ' placed · ' + Object.entries(wallLv).map(([l, n]) => n + ' at level ' + l).join(', ') + '</p>',
      on: {
        up: b => { const bb = S.byId(s, +b.dataset.id); if (bb) CH.Home.upgradeDialog(bb); },
        show: b => { const bb = S.byId(s, +b.dataset.id); UI.closeSheets(); if (bb) CH.Home.select(bb); },
      },
    };
  }

  /* ---------------- Research ---------------- */
  function lab() {
    const s = save(), ll = S.labLevel(s), now = Date.now(), j = s.rjob;
    const row = (kind, id, name, sprite, size, lvl, extra) => {
      const why = S.researchBlocker(s, kind, id), c = S.researchCost(kind, id, lvl + 1);
      return '<div class="r-row">' + (sprite ? '<canvas data-unit="' + sprite + '" data-size="' + size + '"></canvas>' : icon(id, 'big-ico')) + '<div class="b-info"><b>' + name + '</b><span class="muted">Level ' + lvl + ' / ' + CH.RESEARCH.maxLevel(Math.max(1, ll)) + (extra ? ' · ' + extra : '') + '</span></div>' +
        (why === 'Maximum level' ? '<span class="maxed">Max</span>' : '<button class="btn' + (why ? '' : ' btn-gold') + '" data-act="research" data-kind="' + kind + '" data-id="' + id + '"' + (why ? ' disabled title="' + why + '"' : '') + '>' + (why && why !== 'Not enough resources' ? why : UI.cost(c, s) + ' · ' + U.time(CH.RESEARCH.time(lvl + 1))) + '</button>') + '</div>';
    };
    return {
      title: 'Research',
      html: (ll ? '' : '<p class="warn">Build an Arcane Laboratory (castle level 3) to start research.</p>') +
        (j ? '<div class="panel r-job">' + icon('flask') + '<div><b>Researching ' + (j.kind === 'troop' ? CH.TROOPS[j.id].name : CH.SPELLS[j.id].name) + ' level ' + j.to + '</b><div class="bar"><i style="width:' + Math.round((1 - (j.ends - now) / 1000 / j.total) * 100) + '%"></i></div><span class="muted">' + U.time((j.ends - now) / 1000) + ' left</span></div><button class="btn btn-gem" data-act="rush">Finish ' + icon('gems') + Math.max(1, Math.ceil((j.ends - now) / 30000)) + '</button></div>' : '') +
        '<p class="lead">Each troop level adds 14% health and damage. Spell levels make spells stronger. The lab level caps research.</p>' +
        '<h4 class="group">Troops</h4>' + CH.TROOP_ORDER.map(t => row('troop', t, CH.TROOPS[t].name, CH.TROOPS[t].sprite, CH.TROOPS[t].size, s.research.troops[t])).join('') +
        '<h4 class="group">Spells</h4>' + CH.SPELL_ORDER.map(sp => row('spell', sp, CH.SPELLS[sp].name, null, 0, s.research.spells[sp], CH.SPELLS[sp].desc)).join(''),
      on: {
        research: b => { const r = S.research(s, b.dataset.kind, b.dataset.id); if (!r.ok) return fail(r); CH.Audio.play('magic'); persist(); UI.refreshSheet(); },
        rush: () => { const c = Math.max(1, Math.ceil((s.rjob.ends - Date.now()) / 30000)); if (s.res.gems < c) return fail({ reason: 'Not enough gems' }); s.res.gems -= c; s.rjob.ends = Date.now(); CH.App.handleEvents(S.tick(s)); persist(); UI.refreshSheet(); },
      },
    };
  }

  /* ---------------- Resources ---------------- */
  function resources() {
    const s = save();
    const rows = ['gold', 'wood', 'stone'].map(r => {
      const cap = S.capacity(s, r), p = S.productionPerMin(s, r);
      return '<div class="res-card panel">' + icon(r, 'big-ico') + '<div><h3>' + r[0].toUpperCase() + r.slice(1) + '</h3><b>' + U.fmt(s.res[r]) + ' / ' + U.fmt(cap) + '</b><div class="bar"><i style="width:' + Math.min(100, s.res[r] / cap * 100) + '%"></i></div>' +
        '<p class="muted">Production ' + U.fmt(p * 60) + ' per hour. Producers hold about 40 minutes of output until you collect it.</p></div></div>';
    }).join('');
    return {
      title: 'Resources',
      html: '<div class="res-grid">' + rows +
        '<div class="res-card panel">' + icon('gems', 'big-ico') + '<div><h3>Gems</h3><b>' + s.res.gems + '</b><p class="muted">Rare. Earned from player levels, 3-star campaign clears, boss stages, defense records, high fortresses and clearing obstacles. Spend them to finish timers instantly.</p></div></div>' +
        '<div class="res-card panel">' + icon('runes', 'big-ico') + '<div><h3>Runes</h3><b>' + s.res.runes + '</b><p class="muted">Rare material from campaign stages 5 and 6 and every 5 Endless Defense waves. Needed for hero levels above 3.</p></div></div></div>' +
        '<h4 class="group">Where resources come from</h4><ul class="bullets"><li><b>Home:</b> mines, mills and quarries produce over time, even while you\'re away.</li><li><b>Campaign:</b> first clears pay the most; replays pay 25%.</li><li><b>Endless Raid:</b> steal loot from AI kingdoms, plus a star bonus.</li><li><b>Endless Defense:</b> every wave banks rewards, with runes every 5 waves.</li></ul>',
    };
  }

  /* ---------------- Profile ---------------- */
  function profile() {
    const s = save(), cl = S.castleLevel(s);
    let camp = 0; for (const k in s.campaign) camp += s.campaign[k];
    const road = [];
    for (let L = cl + 1; L <= Math.min(8, cl + 3); L++) road.push('<div class="road-step"><b>Castle level ' + L + '</b><ul>' + S.unlocksAt(L).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>');
    const ms = CH.Defense.MILESTONES.map(m => '<span class="chip' + (s.defense.claimed.includes(m.wave) ? ' done' : '') + '">Wave ' + m.wave + ': ' + icon('gems') + m.gems + ' ' + icon('runes') + m.runes + (s.defense.claimed.includes(m.wave) ? ' ✓' : '') + '</span>').join('');
    return {
      title: 'Profile',
      html: '<div class="profile panel"><div class="big-lvl">' + s.player.level + '</div><div><label class="label" for="pname">Ruler name</label><input id="pname" maxlength="24" value="' + esc(s.player.name) + '">' +
        '<div class="bar"><i style="width:' + Math.round(s.player.xp / S.xpFor(s.player.level) * 100) + '%"></i></div><span class="muted">' + s.player.xp + ' / ' + S.xpFor(s.player.level) + ' XP to level ' + (s.player.level + 1) + ' (each level gives gems)</span></div></div>' +
        '<div class="stat-grid">' +
        [['Castle level', cl], ['Campaign stars', camp + ' / 108'], ['Trophies', s.raid.trophies + ' · ' + CH.Raid.league(s.raid.trophies)], ['Raids won', s.raid.wins + ' / ' + s.raid.attacks], ['Best defense wave', s.defense.best], ['Defense runs', s.defense.runs], ['Enemies slain', U.fmt(s.stats.enemiesSlain)], ['Buildings raided', U.fmt(s.stats.buildingsRaided)]]
          .map(([k, v]) => '<div class="panel"><span class="label">' + k + '</span><b>' + v + '</b></div>').join('') + '</div>' +
        '<h4 class="group">Endless Defense records</h4><div class="chips">' + ms + '</div>' +
        '<h4 class="group">What\'s next</h4><div class="road">' + (road.join('') || '<p>Your castle is at its maximum level.</p>') + '</div>',
      onInput: e => { if (e.target.id === 'pname') { s.player.name = e.target.value.trim().slice(0, 24) || 'Lord of Crownhold'; persist(); CH.Home.refreshHud(true); } },
    };
  }

  /* ---------------- Redeem codes ---------------- */
  function redeem() {
    const s = save();
    const got = (CH.REDEEM_CODES || []).filter(c => s.redeemed.includes(c.hash));
    const describe = rw => UI.reward(rw) + (rw.troops ? Object.entries(rw.troops).map(([t, n]) => '<span class="chip">' + n + '× ' + (CH.TROOPS[t] ? CH.TROOPS[t].name : t) + '</span>').join('') : '');
    return {
      title: 'Redeem code',
      html: '<div class="redeem panel"><label class="label" for="rcode">Enter a gift code</label>' +
        '<div class="redeem-row"><input id="rcode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="e.g. WELCOME2026"><button class="btn btn-gold" data-act="go">Redeem</button></div>' +
        '<p class="muted">Codes are not case-sensitive. Each code works once per kingdom. Gifts can go past your storage limits.</p><div id="rmsg" aria-live="polite"></div></div>' +
        '<h4 class="group">Redeemed</h4>' + (got.length ? '<div class="b-list">' + got.map(c => '<div class="b-row"><div class="b-info"><b>' + esc(c.label || 'Gift') + '</b></div><div class="chips">' + describe(c.reward || {}) + '</div></div>').join('') + '</div>' : '<p class="muted">No codes redeemed yet.</p>'),
      on: {
        go: () => {
          const inp = document.getElementById('rcode'), r = S.redeem(s, inp.value);
          if (!r.ok) { document.getElementById('rmsg').innerHTML = '<p class="warn">' + esc(r.reason) + '</p>'; CH.Audio.play('error'); return; }
          persist(); CH.Audio.play('star');
          (r.levels || []).forEach(l => UI.toast('Player level ' + l.level + '! +' + l.gems + ' gems', 'good'));
          UI.refreshSheet(); CH.Home.refreshHud(true);
          UI.modal('<h3>' + esc(r.entry.label || 'Gift received') + '</h3><p>Added to your kingdom:</p><div class="chips">' + describe(r.entry.reward || {}) + '</div><button class="btn btn-gold btn-block" data-close style="margin-top:14px">Wonderful</button>');
        },
      },
      after: el => { const inp = el.querySelector('#rcode'); if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') el.querySelector('[data-act=go]').click(); }); },
    };
  }

  /* ---------------- Settings ---------------- */
  function settings() {
    const st = save().settings;
    const slider = (k, l) => '<label class="set-row"><span>' + l + '</span><input type="range" min="0" max="100" value="' + Math.round(st[k] * 100) + '" data-set="' + k + '"><output>' + Math.round(st[k] * 100) + '%</output></label>';
    const tog = (k, l) => '<label class="set-row"><span>' + l + '</span><input type="checkbox" data-set="' + k + '"' + (st[k] ? ' checked' : '') + '></label>';
    return {
      title: 'Settings',
      html: '<div class="settings"><section class="panel"><h4>Sound</h4>' + slider('music', 'Music volume') + slider('sfx', 'Effects volume') + tog('muted', 'Mute everything') + '</section>' +
        '<section class="panel"><h4>Battle</h4>' + tog('damageNumbers', 'Show big damage numbers') + '</section>' +
        '<section class="panel"><h4>Gift codes</h4><button class="btn" data-act="redeem">Redeem a code</button></section>' +
        '<section class="panel"><h4>Progress</h4><p class="muted">Saved automatically in this browser' + (S.persistent() ? '' : ' (storage is blocked here, so progress lasts only this session)') + '.</p>' +
        (settings.confirm ? '<p class="warn">This erases your kingdom, army, heroes and records. It can\'t be undone.</p><div class="row"><button class="btn btn-danger" data-act="reset2">Erase everything</button><button class="btn" data-act="keep">Keep my kingdom</button></div>' : '<button class="btn btn-danger-quiet" data-act="reset">Reset progress…</button>') + '</section>' +
        '<p class="muted">Crownhold v' + CH.CONFIG.VERSION + '. All art, sound and music are generated in code. Raid opponents are AI-generated; there is no online multiplayer.</p></div>',
      on: {
        redeem: () => UI.sheet('redeem'),
        reset: () => { settings.confirm = true; UI.refreshSheet(); },
        keep: () => { settings.confirm = false; UI.refreshSheet(); },
        reset2: () => { settings.confirm = false; const keep = save().settings; CH.App.save = S.reset(); CH.App.save.settings = keep; persist(); UI.closeSheets(); CH.App.goHome(true); UI.toast('A new kingdom begins.', 'good'); },
      },
      onInput: e => {
        const el = e.target, k = el.dataset.set; if (!k) return;
        if (el.type === 'range') { st[k] = el.value / 100; el.nextElementSibling.textContent = el.value + '%'; } else st[k] = el.checked;
        CH.Audio.apply(st); persist();
      },
    };
  }

  function howto() {
    return {
      title: 'How to play',
      html: '<div class="howto">' +
        '<section class="panel"><h4>The core loop</h4><ol><li><b>Build</b> mines, mills and quarries, then tap them to collect. Storage buildings raise your limits.</li><li><b>Upgrade the castle</b> to unlock new buildings, a larger kingdom, regions and Endless Battle.</li><li><b>Train troops</b> in the Barracks and <b>recruit heroes</b> in the Hero Hall.</li><li><b>Fight</b> in the Campaign, raid AI kingdoms, or test your base in Endless Defense.</li><li><b>Spend</b> the rewards to grow stronger, and repeat.</li></ol></section>' +
        '<section class="panel"><h4>Kingdom controls</h4><ul class="bullets"><li>Drag the ground to pan; scroll or pinch to zoom.</li><li>Tap a building to see it and its actions. Drag a selected building to move it.</li><li>Placing: tap where you want it, then tap it again or press ✓. With a mouse, just click.</li><li>Walls and traps keep placing until you press ✗.</li></ul></section>' +
        '<section class="panel"><h4>Battles</h4><ul class="bullets"><li><b>Raid:</b> pick a troop, then tap or drag outside the red zone to deploy. Troops pick targets on their own; walls make ground troops break through or walk around.</li><li><b>Defense and Campaign:</b> deploy troops and heroes as defenders where you tap. In the campaign, pick a tower and tap open ground beside the road to build it with battle gold.</li><li>Heroes: tap a deployed hero\'s card to use its ability. Spells: pick one, then tap the battlefield.</li><li>Flyers ignore walls. Cannons and mortars can\'t hit them.</li></ul></section></div>',
    };
  }

  return { shop, campaign, stages, endless, raidTargets, raidPrep, army, heroes, buildings, lab, resources, profile, settings, howto, redeem };
})();

</script>
  <script>/* js/ui/battleui.js */
/* =====================================================================
 * Crownhold — ui/battleui.js
 * Battle HUD for all three modes: top info bar, boss bar, deploy bar
 * (troops / heroes / spells / campaign towers), tower panel, blessings
 * and the results screen. Input goes through CH.View's handler.
 * ===================================================================== */
CH.BattleUI = (function () {
  const UI = CH.UI, U = CH.util, T = CH.CONFIG.T, $ = UI.$;
  const st = { b: null, sel: null, pointer: null, hoverTile: null, speed: 1, paused: false, selB: null, key: '', dragLast: null };

  function open(b) {
    st.b = b; st.sel = null; st.selB = null; st.speed = 1; st.paused = false; st.key = '';
    const firstTroop = CH.TROOP_ORDER.find(t => b.army[t] > 0);
    if (b.mode === 'raid' && firstTroop) st.sel = { kind: 'troop', id: firstTroop };
    if (b.mode === 'campaign') st.sel = { kind: 'tower', id: b.towerTypes[0] };
    $('bhud').classList.remove('hidden');
    $('bhud').innerHTML =
      '<div class="b-top"><button class="icon-btn" id="b-quit" title="Leave">' + UI.icon('close') + '</button><div class="bt-info" id="b-info"></div>' +
      '<div class="b-actions"><button class="hud-pill" id="b-speed">1×</button><button class="btn btn-gold" id="b-call"></button></div></div>' +
      '<div class="b-boss hidden" id="b-boss"><span id="b-boss-name"></span><div class="bar"><i id="b-boss-bar"></i></div></div>' +
      '<div class="b-banner" id="b-banner"></div>' +
      '<div class="b-tower hidden" id="b-tower"></div>' +
      '<nav class="b-bar" id="b-bar"></nav>';
    $('b-quit').onclick = quit;
    $('b-speed').onclick = () => { st.speed = st.speed === 1 ? 2 : st.speed === 2 ? 3 : 1; $('b-speed').textContent = st.speed + '×'; };
    $('b-call').onclick = () => { if (st.b.canCallWave && st.b.canCallWave()) st.b.callWave(); };
    $('b-bar').onclick = onBar;
    $('b-tower').onclick = onTowerPanel;
    renderBar(true);
    const intro = b.mode === 'raid' ? 'Raid ' + b.opponent.name : b.mode === 'defense' ? 'Endless Defense' : 'Stage ' + (b.stage.r + 1) + '-' + (b.stage.s + 1) + ': ' + b.stage.name;
    banner(intro, b.mode === 'raid' ? 'Deploy outside the red zone' : b.mode === 'defense' ? 'Place your heroes, then start the first wave' : CH.OBJECTIVES[b.stage.obj]);
  }
  function close() { st.b = null; $('bhud').classList.add('hidden'); $('bhud').innerHTML = ''; }

  let bannerT;
  function banner(t, sub, cls) {
    const el = $('b-banner'); if (!el) return;
    el.className = 'b-banner'; el.innerHTML = '<b>' + UI.esc(t) + '</b>' + (sub ? '<span>' + UI.esc(sub) + '</span>' : '');
    void el.offsetWidth; el.className = 'b-banner show ' + (cls || '');
    clearTimeout(bannerT); bannerT = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ---------- Deploy bar ---------- */
  function renderBar(force) {
    const b = st.b; if (!b) return;
    const key = JSON.stringify([b.army, b.spells, Object.keys(b.heroesUsed).map(h => [h, b.heroesUsed[h].dead, Math.ceil(b.heroesUsed[h].abilityCd)]), st.sel, b.mode === 'campaign' ? Math.floor(b.gold / 10) : 0]);
    if (!force && key === st.key) return;
    st.key = key;
    const items = [];
    const isSel = (k, id) => st.sel && st.sel.kind === k && st.sel.id === id ? ' sel' : '';
    if (b.mode === 'campaign') for (const t of b.towerTypes) {
      const price = CH.TOWER_PRICE[t];
      items.push('<button class="b-card tower' + isSel('tower', t) + (b.gold < price ? ' poor' : '') + '" data-k="tower" data-id="' + t + '"><canvas data-building="' + t + '" data-level="' + b.towerBase[t] + '"></canvas><span class="n">' + CH.BUILDINGS[t].name.split(' ')[0] + '</span><span class="c">' + UI.icon('gold') + price + '</span></button>');
    }
    for (const t of CH.TROOP_ORDER) if ((b.army[t] || 0) > 0 || b.used[t]) {
      const d = CH.TROOPS[t];
      items.push('<button class="b-card' + isSel('troop', t) + (b.army[t] ? '' : ' empty') + '" data-k="troop" data-id="' + t + '"><canvas data-unit="' + d.sprite + '" data-size="' + d.size + '"></canvas><span class="n">' + d.name + '</span><span class="c">×' + (b.army[t] || 0) + '</span></button>');
    }
    for (const h of b.heroesAvail) {
      const d = CH.HEROES[h], u = b.heroesUsed[h];
      let state = 'Deploy';
      if (u) state = u.dead ? 'Fallen' : u.abilityCd > 0 ? Math.ceil(u.abilityCd) + 's' : d.ability.name;
      items.push('<button class="b-card hero' + isSel('hero', h) + (u && u.dead ? ' empty' : '') + (u && !u.dead && u.abilityCd <= 0 ? ' ready' : '') + '" data-k="hero" data-id="' + h + '"><canvas data-unit="' + d.sprite + '" data-size="' + d.size + '"></canvas><span class="n">' + d.name.split(' ').pop() + '</span><span class="c">' + state + '</span>' + (u && !u.dead && u.abilityCd > 0 ? '<i class="cd" style="--cd:' + (u.abilityCd / d.ability.cd).toFixed(2) + '"></i>' : '') + '</button>');
    }
    for (const sp of CH.SPELL_ORDER) if (CH.State.spellUnlocked(b.save, sp)) {
      items.push('<button class="b-card spell' + isSel('spell', sp) + (b.spells[sp] ? '' : ' empty') + '" data-k="spell" data-id="' + sp + '">' + UI.icon(sp, 'sp') + '<span class="n">' + CH.SPELLS[sp].name.split(' ').pop() + '</span><span class="c">×' + b.spells[sp] + '</span></button>');
    }
    if (!items.length) items.push('<p class="b-empty">No troops, heroes or spells. Train an army at home.</p>');
    $('b-bar').innerHTML = items.join('');
    UI.paintCanvases($('b-bar'));
  }
  function onBar(e) {
    const c = e.target.closest('.b-card'); if (!c || !st.b) return;
    const k = c.dataset.k, id = c.dataset.id, b = st.b;
    CH.Audio.play('click');
    if (k === 'hero' && b.heroesUsed[id]) { if (!b.useAbility(id)) UI.toast(b.heroesUsed[id].dead ? 'This hero has fallen.' : 'Ability recharging.', 'warn'); renderBar(true); return; }
    st.sel = st.sel && st.sel.kind === k && st.sel.id === id ? null : { kind: k, id };
    hideTowerPanel();
    renderBar(true);
  }

  /* ---------- Campaign tower panel ---------- */
  function showTowerPanel(bd) {
    st.selB = bd;
    const b = st.b, c = b.towerUpgradeCost(bd);
    $('b-tower').innerHTML = '<b>' + CH.BUILDINGS[bd.type].name + ' · level ' + bd.level + '</b><span>' + Math.round(bd.atk.dmg) + ' damage · range ' + (bd.atk.range / T).toFixed(1) + '</span>' +
      '<div class="row">' + (c === null ? '<button class="btn" disabled>Max</button>' : '<button class="btn btn-gold" data-t="up"' + (b.gold >= c ? '' : ' disabled') + '>Upgrade ' + UI.icon('gold') + c + '</button>') +
      '<button class="btn btn-danger-quiet" data-t="sell">Sell +' + Math.floor(bd.spent * 0.6) + '</button><button class="icon-btn" data-t="x">' + UI.icon('close') + '</button></div>';
    $('b-tower').classList.remove('hidden');
  }
  function hideTowerPanel() { st.selB = null; const el = $('b-tower'); if (el) el.classList.add('hidden'); }
  function onTowerPanel(e) {
    const a = e.target.closest('[data-t]'); if (!a || a.disabled || !st.selB) return;
    if (a.dataset.t === 'up') { st.b.upgradeTower(st.selB); showTowerPanel(st.selB); }
    else if (a.dataset.t === 'sell') { st.b.sellTower(st.selB); hideTowerPanel(); }
    else hideTowerPanel();
  }

  /* ---------- World input ---------- */
  function act(p, fromDrag) {
    const b = st.b; if (!b || b.result) return false;
    const s = st.sel;
    if (!s) {
      if (b.mode === 'campaign' && !fromDrag) {
        const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), k = b.occ[ty * CH.CONFIG.COLS + tx];
        const bd = k ? b.buildings[k - 1] : null;
        if (bd && bd.placed && !bd.dead) { showTowerPanel(bd); return true; }
        hideTowerPanel();
      }
      return false;
    }
    let r;
    if (s.kind === 'tower') {
      const tx = Math.round(p.x / T - 1), ty = Math.round(p.y / T - 1);
      const k = b.occ[Math.floor(p.y / T) * CH.CONFIG.COLS + Math.floor(p.x / T)];
      if (!fromDrag && k && b.buildings[k - 1].placed) { showTowerPanel(b.buildings[k - 1]); return true; }
      r = b.placeTower(s.id, tx, ty);
      if (!r.ok && !fromDrag) { UI.toast(r.reason || 'Can\'t build there', 'warn'); CH.Audio.play('error'); }
      return r.ok;
    }
    if (s.kind === 'troop') { r = b.deployTroop(s.id, p.x, p.y); if (!r.ok && !fromDrag) { UI.toast(r.reason, 'warn'); CH.Audio.play('error'); } if (!b.army[s.id]) st.sel = null; }
    else if (s.kind === 'hero') { r = b.deployHero(s.id, p.x, p.y); if (!r.ok) { UI.toast(r.reason, 'warn'); CH.Audio.play('error'); } else st.sel = null; }
    else if (s.kind === 'spell') { r = { ok: b.castSpell(s.id, p.x, p.y) }; if (!r.ok) UI.toast('No charges left', 'warn'); st.sel = b.spells[s.id] ? s : null; }
    renderBar(true);
    return r && r.ok;
  }
  const handler = {
    tap(p) { act(p, false); },
    hover(p) { st.pointer = p; st.hoverTile = p ? { tx: Math.round(p.x / T - 1), ty: Math.round(p.y / T - 1) } : null; },
    dragStart(p) { if (st.sel && st.sel.kind === 'troop') { st.dragLast = p; act(p, true); return true; } return false; },
    dragMove(p) { st.pointer = p; if (st.dragLast && Math.hypot(p.x - st.dragLast.x, p.y - st.dragLast.y) > 14) { st.dragLast = p; act(p, true); } },
    dragEnd() { st.dragLast = null; },
    cancel() { st.sel = null; hideTowerPanel(); renderBar(true); },
  };

  /* ---------- Per-frame HUD ---------- */
  function tick(dt) {
    const b = st.b; if (!b) return;
    if (!st.paused && !b.pendingBoon && !CH.UI.modalOpen()) {
      const steps = Math.round(dt * 60 * st.speed);
      for (let i = 0; i < Math.min(steps, 12) && !b.result; i++) b.update(1 / 60);
    }
    let info = '', call = '', callOn = false;
    if (b.mode === 'raid') {
      const left = Math.max(0, b.timeLimit - b.time);
      const lg = b.lootGot;
      info = '<span class="pill">' + UI.icon('time') + U.time(left) + '</span><span class="pill stars-pill">' + [0, 1, 2].map(i => '<span class="star' + (i < b.stars ? ' on' : '') + '">' + UI.ICONS.star + '</span>').join('') + '</span><span class="pill">' + b.destruction + '% destroyed</span>' +
        '<span class="pill">' + UI.icon('gold') + U.fmt(lg.gold) + ' ' + UI.icon('wood') + U.fmt(lg.wood) + ' ' + UI.icon('stone') + U.fmt(lg.stone) + '</span>';
      call = 'End battle'; callOn = true;
      $('b-call').onclick = () => { if (!b.result) b.retreat(); };
    } else if (b.mode === 'defense') {
      info = '<span class="pill">Wave ' + b.wave + (b.waveMod ? ' · ' + b.waveMod.name : '') + '</span><span class="pill">Best ' + b.save.defense.best + '</span><span class="pill">' + b.stats.kills + ' slain</span>' +
        '<span class="pill">Banked ' + UI.icon('gold') + U.fmt(b.bank.gold) + ' ' + UI.icon('runes') + b.bank.runes + '</span>';
      const busy = b.spawning || b.units.some(u => u.side === 'atk');
      call = b.wave === 0 ? 'Start wave 1' : busy ? 'Wave in progress' : 'Next wave (' + Math.ceil(Math.max(0, b.breakT)) + ')';
      callOn = !busy && !b.pendingBoon;
    } else {
      const core = b.core;
      info = '<span class="pill">Wave ' + Math.max(0, b.waveIdx + 1) + ' / ' + b.nWaves + '</span><span class="pill gold-pill">' + UI.icon('gold') + Math.floor(b.gold) + '</span>' +
        '<span class="pill">Castle <span class="bar mini"><i style="width:' + Math.round(core.hp / core.maxHp * 100) + '%"></i></span></span>' +
        (b.timeLimit ? '<span class="pill">' + UI.icon('time') + U.time(Math.max(0, b.timeLimit - b.time)) + '</span>' : '');
      const busy = b.spawning || b.units.some(u => u.side === 'atk');
      call = b.waveIdx < 0 ? 'Start wave 1' : b.waveIdx >= b.nWaves - 1 ? 'Final wave' : busy ? 'Call next wave' : 'Next wave (' + Math.ceil(Math.max(0, 10 - b.breakT)) + ')';
      callOn = b.canCallWave();
    }
    if (st.info !== info) { st.info = info; $('b-info').innerHTML = info; }
    const btn = $('b-call');
    if (btn.textContent !== call) btn.textContent = call;
    btn.disabled = !callOn;
    btn.classList.toggle('pulse', callOn && (b.mode !== 'raid') && !b.units.some(u => u.side === 'atk'));
    const boss = b.boss && !b.boss.dead ? b.boss : null;
    $('b-boss').classList.toggle('hidden', !boss);
    if (boss) { $('b-boss-name').textContent = boss.def.name + (boss.enraged ? ' (enraged)' : ''); $('b-boss-bar').style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%'; }
    renderBar(false);
    if (st.selB && b.mode === 'campaign' && st.selB.dead) hideTowerPanel();
  }

  /* ---------- Events ---------- */
  function onEvent(type, d) {
    const b = st.b;
    switch (type) {
      case 'sfx': CH.Audio.play(d); break;
      case 'toast': UI.toast(d.text, d.kind === 'gold' ? 'good' : d.kind === 'danger' ? 'bad' : 'info'); break;
      case 'boss': banner(d.def.name, d.def.desc, 'boss'); CH.Audio.startMusic('boss'); break;
      case 'star': banner('★ ' + d.text, d.stars + (d.stars === 1 ? ' star' : ' stars'), 'star'); break;
      case 'wave': banner('Wave ' + d.n + (d.total ? ' of ' + d.total : ''), d.mod ? d.mod.name + ': ' + d.mod.desc : d.boss ? 'The boss approaches!' : d.mini ? 'A mini-boss leads this wave' : ''); break;
      case 'waveClear': UI.toast('Wave ' + d.n + ' cleared · banked ' + U.fmt(d.rw.gold) + ' gold' + (d.rw.runes ? ', ' + d.rw.runes + ' rune' + (d.rw.runes > 1 ? 's' : '') : ''), 'good'); break;
      case 'boon': boonModal(d); break;
      case 'end': setTimeout(() => CH.App.endBattle(b), 1300); break;
    }
  }
  function boonModal(list) {
    UI.modal('<h3>Wave ' + st.b.wave + ' survived!</h3><p>Choose a blessing for your kingdom.</p><div class="boons">' +
      list.map(x => '<button class="boon" data-boon="' + x.id + '"><b>' + x.name + '</b><span>' + x.desc + '</span></button>').join('') + '</div>',
    { noClose: true, onClick: e => { const c = e.target.closest('[data-boon]'); if (c && st.b) { st.b.chooseBoon(c.dataset.boon); UI.closeModal(); } } });
  }
  function quit() {
    const b = st.b; if (!b || b.result) return;
    const msg = b.mode === 'raid' ? 'End the raid now? You keep the loot you have taken.' : b.mode === 'defense' ? 'End the defense now? You keep everything banked so far.' : 'Leave this stage? Troops you deployed are lost.';
    UI.modal('<h3>Leave battle?</h3><p>' + msg + '</p><div class="row"><button class="btn btn-gold" data-q>Leave</button><button class="btn" data-close>Keep fighting</button></div>',
      { onClick: e => { if (e.target.closest('[data-q]')) { UI.closeModal(); if (b.mode === 'raid') b.retreat(); else b.finish(b.mode === 'defense' ? 'lose' : 'lose', 'You left the battle.'); } } });
  }

  function drawUi() { return { deployMode: st.sel && (st.sel.kind === 'troop' || st.sel.kind === 'hero'), placeTower: st.sel && st.sel.kind === 'tower' ? st.sel.id : null, hoverTile: st.hoverTile, spellAim: st.sel && st.sel.kind === 'spell' ? st.sel.id : null, pointer: st.pointer, selectedB: st.selB }; }

  return { open, close, tick, handler, onEvent, drawUi, state: st };
})();

</script>
  <script>/* js/main.js */
/* =====================================================================
 * Crownhold — main.js
 * Boots the game and owns the top-level flow:
 *   title → kingdom (home) ⇄ battles (campaign / raid / defense) → results
 * Rewards from battles are applied here, in one place.
 * ===================================================================== */
CH.App = (function () {
  const UI = CH.UI, S = CH.State, U = CH.util, $ = UI.$;
  const app = { save: null, view: null, mode: 'title', battle: null, saveTimer: 0, tickTimer: 0 };

  app.persist = () => S.save(app.save);

  app.handleEvents = evs => {
    for (const e of evs || []) {
      if (e.kind === 'built') { UI.toast(CH.BUILDINGS[e.type].name + (e.level > 1 ? ' upgraded to level ' + e.level : ' finished'), 'good'); CH.Audio.play('upgrade'); }
      else if (e.kind === 'research') UI.toast((e.rkind === 'troop' ? CH.TROOPS[e.id].name : CH.SPELLS[e.id].name) + ' research reached level ' + e.level, 'good');
      else if (e.kind === 'cleared') UI.toast('Cleared! ' + Object.entries(e.got).filter(([k]) => k !== 'levels').map(([k, v]) => '+' + v + ' ' + k).join(', ') + (e.gems ? ' and found ' + e.gems + ' gems!' : ''), 'good');
      if (e.levels) for (const l of e.levels) levelUp(l);
    }
    if (evs && evs.length) { app.persist(); CH.Home.refreshHud(true); if (UI.sheetOpen()) UI.refreshSheet(); }
  };
  function levelUp(l) { UI.toast('Player level ' + l.level + '! +' + l.gems + ' gems', 'good'); CH.Audio.play('star'); }

  /* ---------------- Home ---------------- */
  app.goHome = function (reframe) {
    app.mode = 'home'; app.battle = null;
    CH.BattleUI.close();
    document.body.classList.remove('in-battle');
    app.view.handler = CH.Home.handler;
    if (reframe !== false) app.view.frame(S.area(app.save), 1);
    CH.Home.cancelPlacement(); CH.Home.deselect();
    CH.Home.refreshHud(true);
    CH.Audio.startMusic('menu');
  };

  /* ---------------- Battles ---------------- */
  app.startBattle = function (cfg) {
    const s = app.save;
    UI.closeSheets(); UI.closeModal(); CH.Home.cancelPlacement(); CH.Home.deselect();
    const b = new CH.Battle({ ...cfg, save: s, layout: cfg.mode === 'defense' ? s.buildings : undefined });
    b.onEvent = CH.BattleUI.onEvent;
    app.battle = b; app.mode = 'battle';
    document.body.classList.add('in-battle');
    app.view.handler = CH.BattleUI.handler;
    if (cfg.mode === 'defense') app.view.frame(S.area(s), 2);
    else if (cfg.mode === 'raid') { const [w, h] = CH.CONFIG.AREA[cfg.opponent.cl - 1]; app.view.frame({ x: (CH.CONFIG.COLS - w) / 2, y: (CH.CONFIG.ROWS - h) / 2, w, h }, 2); }
    else app.view.frame({ x: 0, y: 0, w: CH.CONFIG.COLS, h: CH.CONFIG.ROWS }, 0);
    CH.BattleUI.open(b);
    CH.Audio.startMusic('battle', cfg.mode === 'campaign' ? 45 + cfg.stage.r : 48);
  };

  /** Apply the outcome of a battle to the save and show the results screen. */
  app.endBattle = function (b) {
    if (!b || b !== app.battle || b.applied) return;
    b.applied = true;
    const s = app.save, win = b.result === 'win';
    for (const t in b.used) s.army[t] = Math.max(0, (s.army[t] || 0) - b.used[t]);
    let html = '', got = {}, actions = '';
    const cl = S.castleLevel(s);
    if (b.mode === 'raid') {
      const op = b.opponent, lg = b.lootGot, stars = b.stars;
      const bonus = win ? Math.round((60 + 60 * cl) * stars) : 0;
      got = S.give(s, { gold: Math.floor(lg.gold) + bonus, wood: Math.floor(lg.wood) + bonus, stone: Math.floor(lg.stone + bonus * 0.6), gems: Math.floor(lg.gems), xp: 12 + Math.round(b.destruction / 3) });
      const tro = win ? Math.max(5, Math.round(op.trophyWin * (0.6 + stars * 0.15))) : -op.trophyLoss;
      s.raid.trophies = Math.max(0, s.raid.trophies + tro);
      s.raid.attacks++; if (win) s.raid.wins++;
      s.stats.buildingsRaided += b.stats.destroyed;
      s.raid.opponents = s.raid.opponents.filter(o => o.id !== op.id);
      html = resultHead(win ? 'Victory!' : 'Defeat', b.reason, stars, 3) + '<p class="big-num">' + b.destruction + '% destroyed</p>' +
        '<div class="res-lines">' + line('Loot taken', UI.reward({ gold: Math.floor(lg.gold), wood: Math.floor(lg.wood), stone: Math.floor(lg.stone), gems: Math.floor(lg.gems) })) + (bonus ? line('Star bonus', UI.reward({ gold: bonus, wood: bonus, stone: Math.floor(bonus * 0.6) })) : '') +
        line('Trophies', '<span class="chip">' + UI.icon('trophy') + (tro >= 0 ? '+' : '') + tro + '</span>') + '</div>' + capNote(s, got);
      actions = '<button class="btn btn-gold btn-lg" data-r="raid">Raid another kingdom</button>';
    } else if (b.mode === 'defense') {
      const reached = b.wave - (b.waveCleared ? 0 : 1);
      const bank = b.bank;
      const record = reached > s.defense.best;
      if (record) s.defense.best = reached;
      s.defense.runs++; s.stats.enemiesSlain += b.stats.kills;
      const ms = CH.Defense.MILESTONES.filter(m => reached >= m.wave && !s.defense.claimed.includes(m.wave));
      let mGems = 0, mRunes = 0;
      for (const m of ms) { s.defense.claimed.push(m.wave); mGems += m.gems; mRunes += m.runes; }
      got = S.give(s, { gold: bank.gold, wood: bank.wood, stone: bank.stone, gems: bank.gems + mGems, runes: bank.runes + mRunes, xp: bank.xp });
      html = resultHead(record ? 'New record!' : 'The defense ends', b.reason, 0, 0) + '<p class="big-num">Survived ' + reached + ' wave' + (reached === 1 ? '' : 's') + '</p>' +
        '<div class="res-lines">' + line('Rewards banked', UI.reward({ gold: bank.gold, wood: bank.wood, stone: bank.stone, gems: bank.gems, runes: bank.runes, xp: bank.xp })) +
        (ms.length ? line('Record milestones', UI.reward({ gems: mGems, runes: mRunes })) : '') + line('Enemies slain', '<b>' + b.stats.kills + '</b>') + '</div>' + capNote(s, got) +
        '<p class="muted">Your real buildings are never damaged by Endless Defense.</p>';
      actions = '<button class="btn btn-gold btn-lg" data-r="defense">Defend again</button>';
    } else {
      const st = b.stage, prev = s.campaign[st.id] || 0;
      s.stats.enemiesSlain += b.stats.kills;
      if (win) {
        const stars = b.campaignStars();
        const rw = prev ? { gold: Math.round(st.reward.gold * 0.25), wood: Math.round(st.reward.wood * 0.25), stone: Math.round(st.reward.stone * 0.25), xp: Math.round(st.reward.xp * 0.3) } : { ...st.reward };
        if (stars === 3 && prev < 3) rw.gems = (rw.gems || 0) + 2;
        s.campaign[st.id] = Math.max(prev, stars);
        s.stats.battlesWon++;
        got = S.give(s, rw);
        const next = st.s < 5 ? st.r + '-' + (st.s + 1) : st.r < 5 ? (st.r + 1) + '-0' : null;
        html = resultHead('Victory!', b.reason, stars, 3) + '<div class="res-lines">' + line(prev ? 'Replay reward' : 'First clear reward', UI.reward(rw)) + '</div>' + capNote(s, got) +
          (st.s === 5 && st.r < 5 ? '<p class="good">' + (S.castleLevel(s) >= CH.REGIONS[st.r + 1].castle ? 'New region unlocked: ' + CH.REGIONS[st.r + 1].name + '!' : 'Upgrade your castle to level ' + CH.REGIONS[st.r + 1].castle + ' to enter ' + CH.REGIONS[st.r + 1].name + '.') + '</p>' : '');
        if (next) { const [nr, ns] = next.split('-').map(Number); if (CH.Campaign.stageUnlocked(s, nr, ns)) actions = '<button class="btn btn-gold btn-lg" data-r="next" data-id="' + next + '">Next stage</button>'; }
      } else {
        html = resultHead('Defeat', b.reason, 0, 3) + '<p>' + campaignTip(b) + '</p>';
        actions = '<button class="btn btn-gold btn-lg" data-r="retry">Try again</button>';
      }
    }
    if (got.levels) got.levels.forEach(levelUp);
    app.persist();
    UI.modal('<div class="results ' + (win ? 'win' : 'lose') + '">' + html + '<div class="row center">' + actions + '<button class="btn" data-r="home">Return to kingdom</button></div></div>', {
      noClose: true, cls: 'results-card',
      onClick: e => {
        const r = e.target.closest('[data-r]'); if (!r) return;
        CH.Audio.play('click'); UI.closeModal();
        const k = r.dataset.r;
        app.goHome(true);
        if (k === 'raid') UI.sheet('raidTargets');
        else if (k === 'defense') app.startBattle({ mode: 'defense' });
        else if (k === 'retry') app.startBattle({ mode: 'campaign', stage: b.stage });
        else if (k === 'next') { const [nr, ns] = r.dataset.id.split('-').map(Number); app.startBattle({ mode: 'campaign', stage: CH.Campaign.stage(nr, ns) }); }
      },
    });
    CH.Audio.startMusic('menu');
  };
  function resultHead(title, reason, stars, max) {
    return '<h2>' + title + '</h2><p class="muted">' + UI.esc(reason || '') + '</p>' + (max ? '<div class="big-stars">' + Array.from({ length: max }, (_, i) => '<span class="bstar' + (i < stars ? ' on' : '') + '" style="--i:' + i + '">' + UI.ICONS.star + '</span>').join('') + '</div>' : '');
  }
  const line = (k, v) => '<div class="res-line"><span>' + k + '</span><span>' + v + '</span></div>';
  function capNote(s, got) {
    const full = ['gold', 'wood', 'stone'].filter(r => s.res[r] >= S.capacity(s, r));
    return full.length ? '<p class="warn">Your ' + full.join(' and ') + ' storage is full; some rewards were lost. Upgrade storage buildings.</p>' : '';
  }
  function campaignTip(b) {
    if (b.stage.obj === 'timed') return 'Time ran out. Build more towers early and call waves sooner.';
    if (b.boss) return 'The boss broke through. Place towers near the end of its road and save spells for it.';
    return 'Build towers at the bends of the road so they hit enemies twice, deploy troops to block, and upgrade your home defenses to make campaign towers stronger.';
  }

  /* ---------------- Title & intro ---------------- */
  function titleScreen() {
    const t = $('title');
    t.innerHTML = '<div class="title-inner"><h1><span>Crown</span><span>hold</span></h1><p class="tag">Build your kingdom. Raid your rivals. Hold the walls.</p>' +
      '<button class="btn btn-gold btn-lg" id="t-play">' + (app.save.introSeen ? 'Enter your kingdom' : 'Found your kingdom') + '</button>' +
      '<div class="row center"><button class="btn btn-quiet" id="t-how">How to play</button><button class="btn btn-quiet" id="t-set">Settings</button></div>' +
      '<p class="t-foot">v' + CH.CONFIG.VERSION + ' · single-player · progress saves in this browser</p></div>';
    t.classList.remove('hidden');
    $('t-play').onclick = () => { CH.Audio.ensure(); CH.Audio.play('heroDeploy'); t.classList.add('hidden'); app.goHome(true); if (!app.save.introSeen) intro(); };
    $('t-how').onclick = () => { CH.Audio.ensure(); t.classList.add('hidden'); app.goHome(true); UI.sheet('howto'); };
    $('t-set').onclick = () => { CH.Audio.ensure(); t.classList.add('hidden'); app.goHome(true); UI.sheet('settings'); };
  }
  function intro() {
    UI.modal('<h3>Welcome, ruler of Crownhold</h3><p>Your kingdom is small, but it is yours. A few steps to get started:</p><ol class="bullets"><li>Tap the glowing coin over your <b>Gold Mine</b> to collect gold.</li><li>Press <b>Build</b> and place a <b>Stone Quarry</b> and a second <b>Builder Hut</b>.</li><li>Press <b>Campaign</b> and win your first battle for big rewards.</li><li>Upgrade the <b>Castle</b> to level 2 to unlock Endless Raid and Endless Defense.</li></ol><p class="muted">The "Next goals" list on the left always shows a good next step.</p><button class="btn btn-gold btn-block" data-close>Let\'s build</button>',
      { onClose: () => { app.save.introSeen = true; app.persist(); } });
  }

  /* ---------------- Loop ---------------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    const time = now / 1000;
    try {
      if (app.mode === 'battle' && app.battle) {
        CH.BattleUI.tick(dt);
        CH.View.drawBattle(app.view, app.battle, CH.BattleUI.drawUi(), app.battle.time);
      } else if (app.view.w) {
        app.tickTimer -= dt;
        if (app.tickTimer <= 0) { app.tickTimer = 0.5; app.handleEvents(S.tick(app.save)); CH.Home.refreshHud(); }
        CH.Home.update(dt);
        CH.View.drawHome(app.view, app.save, { selected: CH.Home.state.selected, ghost: CH.Home.state.ghost, moving: CH.Home.state.moving, floaters: CH.Home.state.floaters }, time);
      }
      app.saveTimer -= dt;
      if (app.saveTimer <= 0) { app.saveTimer = 10; if (app.mode !== 'battle') app.persist(); }
    } catch (err) { console.error('[Crownhold] frame error', err); }
    requestAnimationFrame(frame);
  }

  app.boot = function () {
    app.save = S.load();
    app.handleEvents(S.tick(app.save));
    CH.Audio.apply(app.save.settings);
    app.view = new CH.View.View($('cv'));
    app.view.resize();
    new ResizeObserver(() => app.view.resize()).observe($('world'));
    CH.Home.buildHud();
    app.view.handler = CH.Home.handler;
    app.view.frame(S.area(app.save), 1);
    CH.Home.refreshHud(true);
    window.addEventListener('pointerdown', () => CH.Audio.ensure(), { capture: true });
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (UI.modalOpen()) UI.closeModal(); else if (UI.sheetOpen()) UI.back(); else if (app.mode === 'battle') CH.BattleUI.handler.cancel(); else CH.Home.handler.cancel(); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && app.mode !== 'battle') app.persist(); });
    window.addEventListener('beforeunload', () => { if (app.mode !== 'battle') app.persist(); });
    titleScreen();
    requestAnimationFrame(frame);
  };
  return app;
})();
CH.App.boot();

</script>

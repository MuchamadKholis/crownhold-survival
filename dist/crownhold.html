      else this.initCampaign(cfg.stage);
    }

    emit(t, d) { if (this.onEvent) this.onEvent(t, d); }

    /* ================= Buildings ================= */
    addBuilding(type, level, tx, ty, extra) {
      const d = B[type];
      const b = {
        id: this.nextId++, type, def: d, level, tx, ty, size: d.size, x: tx * T, y: ty * T,
        cx: (tx + d.size / 2) * T, cy: (ty + d.size / 2) * T, hp: d.hp(level), maxHp: d.hp(level),
        cd: this.rand() * 0.5, tgt: null, dead: false, angle: -Math.PI / 2, anim: 0, frozen: 0, hit: 0,
        loot: null, lootTaken: { gold: 0, wood: 0, stone: 0, gems: 0 }, armed: d.cat === 'trap', hidden: false, ...extra,
      };
      if (d.atk) b.atk = this.towerStats(type, level);
      this.buildings.push(b);
      const idx = this.buildings.length;
      if (d.cat === 'trap') this.trapAt[ty * W + tx] = idx;
      else for (let y = ty; y < ty + d.size; y++) for (let x = tx; x < tx + d.size; x++) this.occ[y * W + x] = idx;
      return b;
    }
    towerStats(type, L) {
      const a = B[type].atk;
      return {
        kind: a.kind, dmg: a.dmg(L), rate: a.rate, range: a.range * T, min: (a.min || 0) * T, air: a.air, ground: a.ground,
        splash: (a.splash || 0) * T * (type === 'mageTower' ? 1 + 0.08 * (L - 1) : 1), magic: !!a.magic, vsLarge: a.vsLarge || 1,
        chain: a.chain ? a.chain + (L >= 4 ? 1 : 0) : 0, multishot: type === 'archerTower' && L >= 4, knock: type === 'cannon' && L >= 4,
        slow: type === 'frostTower' ? 0.3 + 0.04 * (L - 1) : 0, freezeChance: type === 'frostTower' && L >= 5 ? 0.15 : 0,
        cluster: type === 'mortar' && L >= 5, pierce: type === 'ballista' && L >= 4,
      };
    }
    bAt(i) { const k = this.occ[i]; if (!k) return null; const b = this.buildings[k - 1]; return b.dead ? null : b; }
    distToB(px, py, b) {
      const dx = Math.max(b.x - px, 0, px - (b.x + b.size * T)), dy = Math.max(b.y - py, 0, py - (b.y + b.size * T));
      return Math.hypot(dx, dy);
    }
    countsForStars(b) { const c = b.def.cat; return c !== 'wall' && c !== 'trap' && c !== 'obstacle'; }

    damageBuilding(b, dmg, src) {
      if (b.dead || b.def.cat === 'trap') return;
      dmg = Math.min(dmg, b.hp);
      b.hp -= dmg; b.hit = 0.12;
      if (b.loot) for (const r in b.loot) { const take = b.loot[r] * dmg / b.maxHp; b.lootTaken[r] += take; this.lootGot[r] += take; }
      if (b.hp <= 0.01) this.destroyBuilding(b, src);
    }
    destroyBuilding(b) {
      if (b.dead) return;
      b.dead = true; b.hp = 0;
      for (let y = b.ty; y < b.ty + b.size; y++) for (let x = b.tx; x < b.tx + b.size; x++) if (this.occ[y * W + x] === this.buildings.indexOf(b) + 1) this.occ[y * W + x] = 0;
      this.burst(b.cx, b.cy, '#d8c39a', 10 + b.size * 6, 120, 'smoke');
      this.burst(b.cx, b.cy, '#ffb35a', 6 + b.size * 4, 160, 'spark');
      this.shake = Math.max(this.shake, b.size >= 3 ? 0.6 : 0.2);
      this.emit('sfx', b.def.cat === 'wall' ? 'wallBreak' : 'collapse');
      if (this.countsForStars(b)) this.stats.destroyed++;
      if (this.mode === 'raid') this.checkRaidStars(b);
      if (this.mode !== 'raid') {
        if (b.type === 'castle' || b.core) this.finish('lose', b.core ? 'Your castle has fallen.' : 'Your castle has fallen.');
        else if (b.objKey && this.stage && this.stage.obj === 'multi') this.finish('lose', 'An outpost was destroyed.');
        else if (b.objKey) { this.objLost = (this.objLost || 0) + 1; this.emit('toast', { text: 'The gold mine was destroyed! You can still win, with fewer stars.', kind: 'danger' }); }
      }
    }

    /* ================= Units ================= */
    spawnUnit(def, side, x, y, o = {}) {
      const mult = o.mult || 1;
      const u = {
        id: this.nextId++, def, key: o.key, side, x, y, hp: def.hp * mult * (o.hpMult || 1), maxHp: def.hp * mult * (o.hpMult || 1),
        dmg: def.dmg * (o.dmgMult || mult), rate: def.rate, range: def.range * T, speed: def.speed * T * (o.speedMult || 1),
        flying: !!def.flying, size: def.size * (o.elite ? 1.2 : 1), armor: def.armor || 0, magic: !!def.magic, splash: (def.splash || 0) * T,
        mode: o.mode || (side === 'atk' ? 'nav' : 'guard'), path: null, pi: 0, wp: o.wp || null, wpi: 1, pathTo: o.pathTo || null,
        ax: o.ax != null ? o.ax : x, ay: o.ay != null ? o.ay : y, tb: null, tu: null, cd: this.rand() * 0.4,
        slowT: 0, slowPct: 0, stunT: 0, rageT: 0, rageAmt: 0, hero: o.hero || null, heroLevel: o.heroLevel || 1,
        elite: !!o.elite, boss: !!def.boss, dead: false, anim: this.rand() * 10, facing: 1, swing: 0, hit: 0,
        summonT: def.summon ? def.summon.every * 0.5 : 0, minions: 0, parent: o.parent || null, abilityCd: 4, abT: {}, enraged: false,
        gold: Math.round((def.gold || 0) * (o.elite ? 3 : 1)), repath: 0,
      };
      if (def.stomp) u.abT.stomp = def.stomp.every * 0.6;
      if (def.warcry) u.abT.warcry = def.warcry.every * 0.5;
      if (def.summonE) u.abT.summonE = def.summonE.every * 0.6;
      if (def.freeze) u.abT.freeze = def.freeze.every * 0.6;
      if (def.inferno) u.abT.inferno = def.inferno.every * 0.6;
      this.units.push(u);
      if (u.boss) { this.boss = u; this.shake = 0.7; this.emit('boss', u); this.emit('sfx', 'roar'); }
      return u;
    }
    enemiesOf(side) { return side === 'atk' ? 'def' : 'atk'; }

    damageUnit(u, dmg, magic, src) {
      if (u.dead) return 0;
      if (!magic) dmg *= 1 - u.armor;
      u.hp -= dmg; u.hit = 0.1;
      if (src && src.def && src.def.lifesteal) src.hp = Math.min(src.maxHp, src.hp + dmg * src.def.lifesteal);
      if (this.save.settings.damageNumbers && dmg >= 60 && this.fx.length < 500) this.fx.push({ kind: 'text', x: u.x, y: u.y - u.size * 2, text: String(Math.round(dmg)), color: '#ffe08a', life: 0.6, max: 0.6, vy: -40 });
      if (u.hp <= 0) this.killUnit(u);
      return dmg;
    }
    killUnit(u) {
      if (u.dead) return;
      u.dead = true;
      this.burst(u.x, u.y - u.size, u.side === 'atk' && this.mode !== 'raid' ? '#b03a2a' : '#e8e2d0', u.boss ? 50 : 8, u.boss ? 200 : 90, 'spark');
      if (u.parent) u.parent.minions--;
      if (u.def.split) {
        for (let i = 0; i < u.def.split.count; i++) {
          const sd = CH.ENEMIES[u.def.split.unit] || CH.SUMMONS[u.def.split.unit];
          const c = this.spawnUnit(sd, u.side, u.x + (this.rand() - 0.5) * 20, u.y + (this.rand() - 0.5) * 20, { mult: u.side === 'atk' && this.mode !== 'raid' ? this.waveMult || this.stageMult || 1 : u.maxHp / u.def.hp, mode: u.mode === 'path' ? 'nav' : u.mode });
          c.tb = u.tb;
        }
      }
      if (u.side === 'atk') {
        if (this.mode !== 'raid') { this.stats.kills++; if (this.mode === 'campaign') { this.gold += u.gold; } }
        else this.stats.lost++;
      }
      if (u.boss) { if (this.boss === u) this.boss = null; this.bossKilled = true; this.shake = 1; this.emit('sfx', 'bossDeath'); this.emit('toast', { text: u.def.name + ' has been slain!', kind: 'gold' }); this.fx.push({ kind: 'ring', x: u.x, y: u.y, r0: 10, r1: 200, life: 1, max: 1, color: '#ffcf6a', w: 6 }); }
      else this.emit('sfx', u.hero ? 'heroDown' : 'death');
      if (u.hero) this.emit('toast', { text: CH.HEROES[u.hero].name + ' has fallen!', kind: 'danger' });
    }

    /* ---------- A* pathfinding for ground attackers ---------- */
    findPath(u, tb) {
      const start = this.tileOf(u.x, u.y);
      const reach = Math.max(u.range, 0.6 * T) + 0.35 * T;
      const isGoal = i => this.distToB(tc(i), tr(i), tb) <= reach;
      stampN++;
      const heap = new Heap();
      gScore[start] = 0; stamp[start] = stampN; came[start] = -1;
      heap.push(start, 0);
      const gx = tb.cx, gy = tb.cy;
      let goal = -1, iter = 0;
      while (heap.size && iter++ < 4000) {
        const cur = heap.pop();
        if (isGoal(cur)) { goal = cur; break; }
        const cx = cur % W, cy = (cur - cx) / W, gc = gScore[cur];
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const ni = ny * W + nx;
          if (this.blocked[ni]) continue;
          if (dx && dy && (this.bAt(cy * W + nx) || this.bAt(ny * W + cx) || this.blocked[cy * W + nx] || this.blocked[ny * W + cx])) continue;
          const ob = this.bAt(ni);
          let step = dx && dy ? 1.414 : 1;
          if (ob && ob !== tb) step += ob.def.cat === 'wall' ? C.WALL_PATH_COST * (0.6 + ob.hp / 1500) : C.BUILDING_PATH_COST;
          const ng = gc + step;
          if (stamp[ni] === stampN && gScore[ni] <= ng) continue;
          stamp[ni] = stampN; gScore[ni] = ng; came[ni] = cur;
          const hx = Math.abs(nx + 0.5 - gx / T), hy = Math.abs(ny + 0.5 - gy / T);
          heap.push(ni, ng + Math.max(hx, hy) + 0.414 * Math.min(hx, hy) - reach / T);
        }
      }
      const path = [];
      for (let i = goal; i !== -1 && i !== start; i = came[i]) path.push(i);
      path.reverse();
      return goal === -1 ? null : path;
    }
    tileOf(x, y) { return U.clamp(Math.floor(y / T), 0, H - 1) * W + U.clamp(Math.floor(x / T), 0, W - 1); }

    chooseBuilding(u) {
      const pref = u.def.target;
      const ok = b => !b.dead && b.def.cat !== 'trap' && b.def.cat !== 'obstacle';
      const filters = [];
      if (pref === 'defense') filters.push(b => !!b.atk);
      if (pref === 'resource') filters.push(b => ['econ', 'storage'].includes(b.def.cat) || b.type === 'castle');
      if (pref === 'walls') filters.push(b => b.def.cat === 'wall');
      filters.push(b => b.def.cat !== 'wall');
      filters.push(() => true);
      for (const f of filters) {
        let best = null, bd = Infinity;
        for (const b of this.buildings) {
          if (!ok(b) || !f(b)) continue;
          const d = this.distToB(u.x, u.y, b);
          if (d < bd) { bd = d; best = b; }
        }
        if (best) return best;
      }
      return null;
    }
    nearestUnit(u, side, radius, fromX, fromY) {
      let best = null, bd = radius * radius;
      const ranged = u.range > 1.2 * T;
      const x = fromX != null ? fromX : u.x, y = fromY != null ? fromY : u.y;
      for (const v of this.units) {
        if (v.dead || v.side !== side) continue;
        if (v.flying && !ranged && !u.flying) continue;
        const d = (v.x - x) ** 2 + (v.y - y) ** 2;
        if (d < bd) { bd = d; best = v; }
      }
      return best;
    }
    /** Moves toward (x,y); returns true once within `near` px. Waypoints use a
     *  generous `near` so crowds pushing each other apart can't deadlock. */
    moveToward(u, x, y, dt, near = 2) {
      const dx = x - u.x, dy = y - u.y, d = Math.hypot(dx, dy);
      if (d < Math.max(0.5, near)) return true;
      let sp = u.speed * (u.slowT > 0 ? 1 - u.slowPct : 1) * (u.rageT > 0 ? 1 + u.rageAmt * 0.6 : 1) * (u.enraged ? 1.4 : 1) * (u.def.rage && u.hp < u.maxHp / 2 ? 1.5 : 1);
      const step = Math.min(d, sp * dt);
      u.x += dx / d * step; u.y += dy / d * step;
      if (Math.abs(dx) > 1) u.facing = dx > 0 ? 1 : -1;
      return d - step < near;
    }

    /* ---------- Attacks ---------- */
    unitDamage(u, target, isB) {
      let d = u.dmg;
      if (u.rageT > 0) d *= 1 + u.rageAmt;
      if (u.def.rage && u.hp < u.maxHp / 2) d *= 1.5;
      if (u.enraged) d *= 1.3;
      if (u.aura) d *= 1 + u.aura;
      if (!isB && target.def.large && u.def.vsLarge) d *= u.def.vsLarge;
      if (isB && u.def.vsRes && ['econ', 'storage'].includes(target.def.cat)) d *= u.def.vsRes;
      if (this.waveMod && this.waveMod.id === 'frenzy' && u.side === 'atk') d *= 1.3;
      return d;
    }
    attack(u, target, isB) {
      if (u.cd > 0) return;
      const rateMult = (u.rageT > 0 ? 1 + u.rageAmt * 0.5 : 1) * (u.def.rage && u.hp < u.maxHp / 2 ? 1.5 : 1) * (u.enraged ? 1.3 : 1);
      u.cd = 1 / (u.rate * rateMult);
      u.swing = 0.22;
      const tx = isB ? target.cx : target.x;
      if (Math.abs(tx - u.x) > 2) u.facing = tx > u.x ? 1 : -1;
      const dmg = this.unitDamage(u, target, isB);
      if (u.def.suicide) {
        const r = u.def.suicide * T;
        for (const b of this.buildings) if (!b.dead && this.distToB(u.x, u.y, b) <= r) this.damageBuilding(b, b.def.cat === 'wall' ? dmg : dmg * 0.25, u);
        this.explosionFx(u.x, u.y, r);
        u.hp = 0; this.killUnit(u);
        return;
      }
      if (u.def.proj) {
        this.proj.push({ kind: u.def.proj, x: u.x, y: u.y - u.size, target, isB, speed: 330, dmg, splash: u.splash, side: u.side, magic: u.magic, src: u, air: true, ground: true });
        this.emit('sfx', u.def.proj === 'arrow' ? 'bow' : u.def.proj === 'fire' ? 'fireShot' : 'magic');
      } else {
        this.hit(u.side, target, isB, dmg, u.splash, u.magic, u, true, true);
        this.emit('sfx', u.size >= 15 ? 'smash' : 'sword');
      }
    }
    /** Applies damage at a target with optional splash to everything hostile to `side`. */
    hit(side, target, isB, dmg, splash, magic, src, air, ground, extra) {
      if (splash > 0) {
        const x = isB ? target.cx : target.x, y = isB ? target.cy : target.y;
        this.splash(side, x, y, splash, dmg, magic, src, air, ground, extra);
        return;
      }
      if (isB) this.damageBuilding(target, dmg, src);
      else { this.damageUnit(target, dmg, magic, src); if (extra) this.applyExtra(target, extra); }
    }
    splash(side, x, y, r, dmg, magic, src, air = true, ground = true, extra) {
      const foe = this.enemiesOf(side);
      for (const v of this.units) {
        if (v.dead || v.side !== foe || (v.flying && !air) || (!v.flying && !ground)) continue;
        const d = Math.hypot(v.x - x, v.y - y);
        if (d <= r + v.size * 0.5) { this.damageUnit(v, dmg * (1 - 0.35 * d / (r + 1)), magic, src); if (extra) this.applyExtra(v, extra); }
      }
      if (foe === 'def' && ground) for (const b of this.buildings) if (!b.dead && b.def.cat !== 'trap' && this.distToB(x, y, b) <= r) this.damageBuilding(b, dmg * 0.8, src);
      if (r > 0.9 * T) this.fx.push({ kind: 'ring', x, y, r0: 4, r1: r, life: 0.3, max: 0.3, color: magic ? '#c9a2ff' : '#ffb35a', w: 3 });
    }
    applyExtra(v, ex) {
      if (ex.slow && !v.boss) { v.slowPct = Math.max(v.slowT > 0 ? v.slowPct : 0, ex.slow); v.slowT = 2; }
      else if (ex.slow) { v.slowPct = ex.slow * 0.5; v.slowT = 2; }
      if (ex.stun) v.stunT = Math.max(v.stunT, v.boss ? ex.stun * 0.3 : ex.stun);
      if (ex.freeze && this.rand() < ex.freeze && !v.boss) v.stunT = Math.max(v.stunT, 1.5);
    }

    /* ================= Main update ================= */
    update(dt) {
      if (this.result) { this.updateFx(dt); return; }
      this.time += dt;
      if (this.mode === 'raid') this.updateRaid(dt);
      else this.updateWaves(dt);
      if (this.result) return;
      this.updateUnits(dt);
      this.updateTowers(dt);
      this.updateProjectiles(dt);
      this.updateAreas(dt);
      this.updateFx(dt);
      let w = 0;
      for (const u of this.units) if (!u.dead) this.units[w++] = u;
      this.units.length = w;
      this.checkEnd();
    }

    updateUnits(dt) {
      const us = this.units;
      for (let i = 0; i < us.length; i++) {
        const u = us[i];
        if (u.dead) continue;
        u.anim += dt; if (u.cd > 0) u.cd -= dt; if (u.swing > 0) u.swing -= dt; if (u.hit > 0) u.hit -= dt;
        if (u.slowT > 0) u.slowT -= dt; if (u.rageT > 0) u.rageT -= dt;
        if (u.def.regen) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * u.def.regen * dt);
        if (u.def.heal) for (const v of us) if (!v.dead && v !== u && v.side === u.side && v.hp < v.maxHp && (v.x - u.x) ** 2 + (v.y - u.y) ** 2 < (2.5 * T) ** 2) v.hp = Math.min(v.maxHp, v.hp + u.def.heal * dt * (u.maxHp / u.def.hp));
        if (u.hero === 'king') for (const v of us) if (!v.dead && v.side === u.side && v !== u) v.aura = (v.x - u.x) ** 2 + (v.y - u.y) ** 2 < (3 * T) ** 2 ? CH.HEROES.king.aura : 0;
        if (u.hero) u.abilityCd = Math.max(0, u.abilityCd - dt);
        if (u.def.summon) this.updateSummoner(u, dt);
        if (u.boss || u.def.stomp || u.def.summonE) this.updateBossAbilities(u, dt);
        if (u.stunT > 0) { u.stunT -= dt; continue; }
        if (u.side === 'atk') this.updateAttacker(u, dt);
        else this.updateDefender(u, dt);
        if (!u.flying && u.side === 'atk' && !u.dead) {
          const tr = this.trapAt[this.tileOf(u.x, u.y)];
          if (tr) { const trap = this.buildings[tr - 1]; if (trap.armed) this.triggerTrap(trap); }
        }
      }
      // Gentle separation so crowds don't stack into one blob.
      for (let i = 0; i < us.length; i++) {
        const a = us[i];
        if (a.dead || a.flying) continue;
        for (let j = i + 1; j < us.length; j++) {
          const b = us[j];
          if (b.dead || b.flying || b.side !== a.side) continue;
          const dx = b.x - a.x, dy = b.y - a.y, min = (a.size + b.size) * 0.7, d2 = dx * dx + dy * dy;
          if (d2 > 0.01 && d2 < min * min) {
            const d = Math.sqrt(d2), push = (min - d) * 0.25;
            a.x -= dx / d * push; a.y -= dy / d * push; b.x += dx / d * push; b.y += dy / d * push;
          }
        }
      }
    }

    updateAttacker(u, dt) {
      // 1) Fight defenders who get close (except siege units that only want buildings).
      if (u.def.target !== 'defense' && u.def.target !== 'walls') {
        if (u.tu && (u.tu.dead || Math.hypot(u.tu.x - u.x, u.tu.y - u.y) > u.range + 3 * T)) u.tu = null;
        if (!u.tu) u.tu = this.nearestUnit(u, 'def', u.range + 1.6 * T);
        if (u.tu) {
          if (Math.hypot(u.tu.x - u.x, u.tu.y - u.y) <= u.range + u.tu.size + 4) this.attack(u, u.tu, false);
          else this.moveToward(u, u.tu.x, u.tu.y, dt);
          return;
        }
      }
      // 2) Campaign roads.
      if (u.mode === 'path') {
        const p = u.wp[u.wpi];
        if (this.moveToward(u, p.x, p.y, dt, 0.35 * T)) {
          u.wpi++;
          if (u.wpi >= u.wp.length) { u.mode = 'nav'; u.tb = u.pathTo && !u.pathTo.dead ? u.pathTo : null; u.path = null; }
        }
        return;
      }
      // 3) Buildings.
      if (!u.tb || u.tb.dead) { u.tb = this.chooseBuilding(u); u.path = null; u.pi = 0; if (!u.tb) return; }
      const tb = u.tb;
      if (this.distToB(u.x, u.y, tb) <= u.range + 0.35 * T) { this.attack(u, tb, true); return; }
      if (u.flying) { this.moveToward(u, tb.cx, tb.cy, dt); return; }
      if (!u.path) { u.path = this.findPath(u, tb) || []; u.pi = 0; }
      if (u.pi < u.path.length) {
        const k = u.path[u.pi];
        const ob = this.bAt(k);
        if (ob && ob !== tb) {
          if (this.distToB(u.x, u.y, ob) <= u.range + 0.35 * T) { this.attack(u, ob, true); return; }
        }
        if (this.moveToward(u, tc(k), tr(k), dt, 0.35 * T)) u.pi++;
      } else this.moveToward(u, tb.cx, tb.cy, dt);
    }

    updateDefender(u, dt) {
      const leash = (u.hero ? 6 : 4.5) * T;
      if (u.tu && (u.tu.dead || Math.hypot(u.tu.x - u.ax, u.tu.y - u.ay) > leash + 2 * T)) u.tu = null;
      if (!u.tu) u.tu = this.nearestUnit(u, 'atk', leash, u.ax, u.ay);
      if (u.tu) {
        if (Math.hypot(u.tu.x - u.x, u.tu.y - u.y) <= u.range + u.tu.size + 4) this.attack(u, u.tu, false);
        else this.moveToward(u, u.tu.x, u.tu.y, dt);
      } else this.moveToward(u, u.ax, u.ay, dt);
    }

    updateSummoner(u, dt) {
      u.summonT -= dt;
      if (u.summonT > 0 || u.minions >= u.def.summon.max) return;
      u.summonT = u.def.summon.every;
      this.raiseSkeletons(u, 1);
    }
    raiseSkeletons(u, n) {
      const lvl = this.save.research.troops.necromancer || 1;
      for (let i = 0; i < n; i++) {
        const a = this.rand() * Math.PI * 2;
        const s = this.spawnUnit(CH.SUMMONS.skeleton, u.side, u.x + Math.cos(a) * 18, u.y + Math.sin(a) * 18, { mult: CH.RESEARCH.troopMult(lvl) * (u.hero ? CH.State.heroMult(u.heroLevel) : 1), parent: u, mode: u.side === 'atk' ? 'nav' : 'guard', ax: u.x + Math.cos(a) * 30, ay: u.y + Math.sin(a) * 30 });
        u.minions++;
        this.burst(s.x, s.y, '#7dffc8', 8, 60, 'spark');
      }
      this.emit('sfx', 'summon');
    }

    updateBossAbilities(u, dt) {
      const d = u.def, foe = this.enemiesOf(u.side);
      for (const k in u.abT) u.abT[k] -= dt;
      if (d.enrage && !u.enraged && u.hp < u.maxHp * d.enrage) { u.enraged = true; this.emit('toast', { text: d.name + ' is enraged!', kind: 'danger' }); this.emit('sfx', 'roar'); }
      if (d.stomp && u.abT.stomp <= 0) {
        u.abT.stomp = d.stomp.every;
        const r = d.stomp.radius * T, dmg = d.stomp.dmg * (this.waveMult || this.stageMult || 1);
        for (const v of this.units) if (!v.dead && v.side === foe && !v.flying && Math.hypot(v.x - u.x, v.y - u.y) < r) { this.damageUnit(v, dmg, true, u); v.stunT = Math.max(v.stunT, 1); }
        for (const b of this.buildings) if (!b.dead && this.distToB(u.x, u.y, b) < r) this.damageBuilding(b, dmg * 0.6, u);
        this.fx.push({ kind: 'ring', x: u.x, y: u.y, r0: 6, r1: r, life: 0.5, max: 0.5, color: '#c9a070', w: 6 });
        this.shake = Math.max(this.shake, 0.4); this.emit('sfx', 'smash');
      }
      if (d.warcry && u.abT.warcry <= 0) {
        u.abT.warcry = d.warcry.every;
        for (const v of this.units) if (!v.dead && v.side === u.side && Math.hypot(v.x - u.x, v.y - u.y) < d.warcry.radius * T) { v.rageT = d.warcry.dur; v.rageAmt = d.warcry.boost; }
        this.fx.push({ kind: 'ring', x: u.x, y: u.y, r0: 10, r1: d.warcry.radius * T, life: 0.6, max: 0.6, color: '#ff4a3a', w: 5 });
        this.emit('sfx', 'warcry');
      }
      if (d.summonE && u.abT.summonE <= 0) {
        u.abT.summonE = d.summonE.every;
        for (let i = 0; i < d.summonE.count; i++) {
          const c = this.spawnUnit(CH.ENEMIES[d.summonE.unit], u.side, u.x + (this.rand() - 0.5) * 40, u.y + (this.rand() - 0.5) * 40, { mult: this.waveMult || this.stageMult || 1, mode: 'nav' });
          c.tb = u.tb;
        }
        this.fx.push({ kind: 'ring', x: u.x, y: u.y, r0: 6, r1: 60, life: 0.5, max: 0.5, color: '#c9a2ff', w: 3 });
      }
      if (d.freeze && u.abT.freeze <= 0) {
        u.abT.freeze = d.freeze.every;
        for (const b of this.buildings) if (!b.dead && b.atk && this.distToB(u.x, u.y, b) < d.freeze.radius * T) { b.frozen = d.freeze.dur; this.burst(b.cx, b.cy, '#bfe9ff', 10, 80, 'spark'); }
        this.fx.push({ kind: 'ring', x: u.x, y: u.y, r0: 10, r1: d.freeze.radius * T, life: 0.7, max: 0.7, color: '#bfe9ff', w: 6 });
        this.emit('sfx', 'freeze');
      }
      if (d.aura) {
        for (const v of this.units) if (!v.dead && v.side === foe && Math.hypot(v.x - u.x, v.y - u.y) < d.aura.radius * T) this.damageUnit(v, d.aura.dps * dt, true, null);
      }
      if (d.inferno && u.abT.inferno <= 0 && u.tb && !u.tb.dead) {
        u.abT.inferno = d.inferno.every;
        const x = u.tb.cx, y = u.tb.cy, r = d.inferno.radius * T, dmg = d.inferno.dmg * (this.waveMult || this.stageMult || 1);
        for (const b of this.buildings) if (!b.dead && this.distToB(x, y, b) < r) this.damageBuilding(b, dmg, u);
        for (const v of this.units) if (!v.dead && v.side === foe && Math.hypot(v.x - x, v.y - y) < r) this.damageUnit(v, dmg * 0.7, true, u);
        this.fx.push({ kind: 'beam', x0: u.x, y0: u.y - u.size, x, y, life: 0.6, max: 0.6, color: '255,120,40' });
        this.explosionFx(x, y, r);
        this.emit('sfx', 'roar');
      }
    }

    triggerTrap(trap) {
      trap.armed = false; trap.hidden = false; trap.dead = true;
      const t = trap.def.trap, x = trap.cx, y = trap.cy, r = t.radius * T;
      if (trap.type === 'fireTrap') {
        this.areas.push({ kind: 'fire', x, y, r, dps: t.dps(trap.level), t: t.dur, side: 'def' });
        this.emit('sfx', 'fire');
      } else {
        for (const v of this.units) if (!v.dead && v.side === 'atk' && !v.flying && Math.hypot(v.x - x, v.y - y) <= r + v.size * 0.4) this.damageUnit(v, t.dmg(trap.level), false, null);
        if (trap.type === 'bombTrap') this.explosionFx(x, y, r); else this.burst(x, y, '#cfcfcf', 10, 90, 'spark');
        this.emit('sfx', trap.type === 'bombTrap' ? 'boom' : 'spike');
      }
    }

    /* ---------- Towers ---------- */
    updateTowers(dt) {
      for (const b of this.buildings) {
        if (b.dead) continue;
        if (b.hit > 0) b.hit -= dt;
        if (b.anim > 0) b.anim -= dt;
        if (!b.atk) continue;
        if (b.frozen > 0) { b.frozen -= dt; continue; }
        b.cd -= dt * this.buffs.defRate;
        if (b.cd > 0) continue;
        const a = b.atk;
        let t = b.tgt;
        const valid = v => v && !v.dead && v.side === 'atk' && (v.flying ? a.air : a.ground) && this.distToB(v.x, v.y, b) <= a.range && Math.hypot(v.x - b.cx, v.y - b.cy) >= a.min;
        if (!valid(t)) {
          t = null; let bd = Infinity;
          for (const v of this.units) { if (!valid(v)) continue; const d = this.distToB(v.x, v.y, b); if (d < bd) { bd = d; t = v; } }
          b.tgt = t;
        }
        if (!t) { b.cd = 0; continue; }
        b.cd = 1 / a.rate;
        b.anim = 0.2;
        b.angle = Math.atan2(t.y - b.cy, t.x - b.cx);
        this.fireTower(b, t);
      }
    }
    fireTower(b, t) {
      const a = b.atk, dmg = a.dmg * this.buffs.defDmg, ox = b.cx, oy = b.cy - b.size * 10;
      const mk = (kind, target, extra) => this.proj.push({ kind, x: ox, y: oy, target, isB: false, speed: kind === 'ball' ? 420 : kind === 'bolt' ? 620 : 520, dmg, splash: a.splash, side: 'def', magic: a.magic, air: a.air, ground: a.ground, vsLarge: a.vsLarge, ...extra });
      switch (a.kind) {
        case 'arrow':
          mk('arrow', t);
          if (a.multishot) { const o = this.units.find(v => v !== t && !v.dead && v.side === 'atk' && this.distToB(v.x, v.y, b) <= a.range); if (o) mk('arrow', o); }
          this.emit('sfx', 'bow'); break;
        case 'ball': mk('ball', t, { extra: a.knock ? { stun: 0.3 } : null }); this.emit('sfx', 'cannon'); break;
        case 'orb': mk('orb', t); this.emit('sfx', 'magic'); break;
        case 'frost': mk('frost', t, { extra: { slow: a.slow, freeze: a.freezeChance } }); this.emit('sfx', 'frost'); break;
        case 'bolt': mk('bolt', t, { pierce: a.pierce ? 3 : 0, hits: a.pierce ? new Set() : null, vx: (t.x - ox), vy: (t.y - oy) }); this.emit('sfx', 'ballista'); break;
        case 'shell': {
          const dur = 1.1 + Math.hypot(t.x - b.cx, t.y - b.cy) / 900;
          this.proj.push({ kind: 'shell', sx: ox, sy: oy, tx: t.x, ty: t.y, x: ox, y: oy, z: 0, t: 0, dur, dmg, splash: a.splash, side: 'def', cluster: a.cluster });
          this.emit('sfx', 'mortar'); break;
        }
        case 'zap': {
          const hitSet = new Set([t]); const pts = [{ x: ox, y: oy }, { x: t.x, y: t.y - t.size }];
          this.damageUnit(t, dmg, true, null);
          let cur = t;
          for (let k = 0; k < a.chain; k++) {
            let nx = null, bd = (2.6 * T) ** 2;
            for (const v of this.units) { if (v.dead || v.side !== 'atk' || hitSet.has(v)) continue; const d = (v.x - cur.x) ** 2 + (v.y - cur.y) ** 2; if (d < bd) { bd = d; nx = v; } }
            if (!nx) break;
            hitSet.add(nx); pts.push({ x: nx.x, y: nx.y - nx.size }); this.damageUnit(nx, dmg * 0.75, true, null); cur = nx;
          }
          this.fx.push({ kind: 'bolt', pts, life: 0.2, max: 0.2, color: '#a8e6ff' });
          this.emit('sfx', 'zap'); break;
        }
      }
    }

    updateProjectiles(dt) {
      const L = this.proj;
      for (let i = L.length - 1; i >= 0; i--) {
        const p = L[i];
        let done = false;
        if (p.kind === 'shell') {
          p.t += dt; const k = Math.min(1, p.t / p.dur);
          p.x = U.lerp(p.sx, p.tx, k); p.y = U.lerp(p.sy, p.ty, k); p.z = Math.sin(k * Math.PI) * 90;
          if (k >= 1) {
            this.splash('def', p.tx, p.ty, p.splash, p.dmg, false, null, false, true);
            this.explosionFx(p.tx, p.ty, p.splash); this.emit('sfx', 'boom');
            if (p.cluster) for (let c = 0; c < 3; c++) { const a = this.rand() * 6.28, r = 30 + this.rand() * 25; L.push({ kind: 'shell', sx: p.tx, sy: p.ty, tx: p.tx + Math.cos(a) * r, ty: p.ty + Math.sin(a) * r, x: p.tx, y: p.ty, z: 0, t: 0, dur: 0.4, dmg: p.dmg * 0.35, splash: p.splash * 0.6, side: 'def' }); }
            done = true;
          }
        } else if (p.pierce) {
          const d = Math.hypot(p.vx, p.vy) || 1;
          p.x += p.vx / d * p.speed * dt; p.y += p.vy / d * p.speed * dt; p.a = Math.atan2(p.vy, p.vx);
          p.travel = (p.travel || 0) + p.speed * dt;
          for (const v of this.units) {
            if (v.dead || v.side !== 'atk' || p.hits.has(v)) continue;
            if (Math.hypot(v.x - p.x, v.y - v.size - p.y) > v.size + 8) continue;
            p.hits.add(v); this.damageUnit(v, p.dmg * (v.def.large ? p.vsLarge : 1), false, null);
            if (--p.pierce <= 0) { done = true; break; }
          }
          if (p.travel > 9 * T) done = true;
        } else {
          const t = p.target;
          const alive = t && !t.dead;
          if (alive) { p.tx = p.isB ? t.cx : t.x; p.ty = p.isB ? t.cy : t.y - (t.size || 8) * 0.8; }
          else if (p.tx === undefined) { done = true; }
          if (!done) {
            const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = p.speed * dt;
            p.a = Math.atan2(dy, dx);
            if (d <= step + 4) {
              if (alive || p.splash) {
                let dmg = p.dmg;
                if (!p.isB && alive && t.def.large && p.vsLarge) dmg *= p.vsLarge;
                if (alive) this.hit(p.side, t, p.isB, dmg, p.splash, p.magic, p.src, p.air !== false, p.ground !== false, p.extra);
                else this.splash(p.side, p.tx, p.ty, p.splash, dmg, p.magic, p.src, p.air !== false, p.ground !== false, p.extra);
                if (p.kind === 'orb' || p.kind === 'frost' || p.kind === 'fire' || p.kind === 'shadow') this.burst(p.tx, p.ty, p.kind === 'frost' ? '#bfe9ff' : p.kind === 'fire' ? '#ff9a3a' : p.kind === 'shadow' ? '#9a6ad8' : '#c9a2ff', 6, 70, 'spark');
              }
              done = true;
            } else { p.x += dx / d * step; p.y += dy / d * step; }
          }
        }
        if (done) { L[i] = L[L.length - 1]; L.pop(); }
      }
    }

    updateAreas(dt) {
      for (let i = this.areas.length - 1; i >= 0; i--) {
        const a = this.areas[i];
        a.t -= dt;
        if (a.kind === 'fire') { for (const v of this.units) if (!v.dead && v.side === 'atk' && !v.flying && Math.hypot(v.x - a.x, v.y - a.y) < a.r) this.damageUnit(v, a.dps * dt, true, null); }
        else if (a.kind === 'heal') { for (const v of this.units) if (!v.dead && v.side === a.side && Math.hypot(v.x - a.x, v.y - a.y) < a.r) v.hp = Math.min(v.maxHp, v.hp + a.hps * dt); }
        else if (a.kind === 'rage') { for (const v of this.units) if (!v.dead && v.side === a.side && Math.hypot(v.x - a.x, v.y - a.y) < a.r) { v.rageT = 0.3; v.rageAmt = a.boost; } }
        if (a.t <= 0) this.areas.splice(i, 1);
      }
    }

    /* ---------- Player actions ---------- */
    troopMult(type) { return CH.RESEARCH.troopMult(this.save.research.troops[type] || 1); }

    /** Raid: you may deploy on any tile not within 1 tile of a standing building. */
    canDeploy(x, y) {
      if (this.mode !== 'raid') return x >= 0 && y >= 0 && x < W * T && y < H * T && !this.blocked[this.tileOf(x, y)] && !this.bAt(this.tileOf(x, y));
      const tx = Math.floor(x / T), ty = Math.floor(y / T);
      if (tx < 0 || ty < 0 || tx >= W || ty >= H) return false;
      for (let yy = ty - 1; yy <= ty + 1; yy++) for (let xx = tx - 1; xx <= tx + 1; xx++) {
        if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
        if (this.bAt(yy * W + xx)) return false;
      }
      return true;
    }
    deployTroop(type, x, y) {
      if (this.result || !(this.army[type] > 0)) return { ok: false, reason: 'None left' };
      if (!this.canDeploy(x, y)) return { ok: false, reason: this.mode === 'raid' ? 'Deploy outside the red zone' : 'Can\'t deploy there' };
      this.army[type]--; this.used[type] = (this.used[type] || 0) + 1;
      const def = CH.TROOPS[type];
      this.spawnUnit(def, this.playerSide, x, y, { mult: this.troopMult(type), key: type, ax: x, ay: y });
      this.deployedAny = true;
      this.emit('sfx', 'deploy');
      return { ok: true };
    }
    deployHero(id, x, y) {
      if (this.result || this.heroesUsed[id] || !this.heroesAvail.includes(id)) return { ok: false, reason: 'Hero unavailable' };
      if (!this.canDeploy(x, y)) return { ok: false, reason: this.mode === 'raid' ? 'Deploy outside the red zone' : 'Can\'t deploy there' };
      const lvl = this.save.heroes[id].level, m = CH.State.heroMult(lvl);
      const u = this.spawnUnit(CH.HEROES[id], this.playerSide, x, y, { mult: m, hero: id, heroLevel: lvl, ax: x, ay: y });
      u.abilityCd = 3;
      this.heroesUsed[id] = u;
      this.deployedAny = true;
      this.emit('sfx', 'heroDeploy');
      return { ok: true, unit: u };
    }
    useAbility(id) {
      const u = this.heroesUsed[id];
      if (!u || u.dead || u.abilityCd > 0 || this.result) return false;
      const foe = this.enemiesOf(u.side), ab = CH.HEROES[id].ability;
      u.abilityCd = ab.cd;
      const hitArea = (x, y, r, dmg, stun) => {
        for (const v of this.units) if (!v.dead && v.side === foe && Math.hypot(v.x - x, v.y - y) < r) { this.damageUnit(v, dmg, true, u); if (stun) v.stunT = Math.max(v.stunT, v.boss ? stun * 0.3 : stun); }
        if (foe === 'def') for (const b of this.buildings) if (!b.dead && b.def.cat !== 'trap' && this.distToB(x, y, b) < r) this.damageBuilding(b, dmg, u);
      };
      switch (ab.id) {
        case 'royalCharge': hitArea(u.x, u.y, 2.5 * T, u.dmg * 3, 2); this.fx.push({ kind: 'ring', x: u.x, y: u.y, r0: 6, r1: 2.5 * T, life: 0.5, max: 0.5, color: '#ffd76a', w: 6 }); this.shake = 0.4; this.emit('sfx', 'smash'); break;
        case 'arrowStorm': {
          const targets = this.units.filter(v => !v.dead && v.side === foe && Math.hypot(v.x - u.x, v.y - u.y) < u.range * 1.4);
          const bTargets = foe === 'def' ? this.buildings.filter(b => !b.dead && b.def.cat !== 'trap' && this.distToB(u.x, u.y, b) < u.range * 1.4) : [];
          for (let k = 0; k < 10; k++) {
            if (targets.length) this.proj.push({ kind: 'arrow', x: u.x, y: u.y - 14, target: targets[k % targets.length], isB: false, speed: 520, dmg: u.dmg * 1.2, side: u.side, src: u, air: true, ground: true });
            else if (bTargets.length) this.proj.push({ kind: 'arrow', x: u.x, y: u.y - 14, target: bTargets[k % bTargets.length], isB: true, speed: 520, dmg: u.dmg * 1.2, side: u.side, src: u });
          }
          this.emit('sfx', 'bow'); break;
        }
        case 'meteor': {
          const t = u.tu || u.tb || this.nearestUnit(u, foe, 10 * T);
          const x = t ? (t.cx || t.x) : u.x, y = t ? (t.cy || t.y) : u.y;
          hitArea(x, y, 2.6 * T, u.dmg * 6, 1);
          this.fx.push({ kind: 'beam', x0: x, y0: 0, x, y, life: 0.5, max: 0.5, color: '255,150,60' });
          this.explosionFx(x, y, 2.6 * T); this.shake = 0.6; this.emit('sfx', 'boom'); break;
        }
        case 'shadowCleave': hitArea(u.x, u.y, 1.8 * T, u.dmg * 2.5, 0); u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.25); this.fx.push({ kind: 'ring', x: u.x, y: u.y, r0: 4, r1: 1.8 * T, life: 0.35, max: 0.35, color: '#a070ff', w: 7 }); this.emit('sfx', 'smash'); break;
        case 'raiseLegion': this.raiseSkeletons(u, 6); break;
      }
      return true;
    }
    castSpell(id, x, y) {
      if (this.result || !(this.spells[id] > 0)) return false;
      const sp = CH.SPELLS[id], L = this.save.research.spells[id] || 1, r = sp.radius * T;
      const foe = this.enemiesOf(this.playerSide);
      this.spells[id]--;
      if (id === 'fireball') {
        const dmg = sp.dmg(L);
        for (const v of this.units) if (!v.dead && v.side === foe && Math.hypot(v.x - x, v.y - y) < r) this.damageUnit(v, dmg, true, null);
        if (foe === 'def') for (const b of this.buildings) if (!b.dead && b.def.cat !== 'trap' && this.distToB(x, y, b) < r) this.damageBuilding(b, dmg * 0.7, null);
        this.fx.push({ kind: 'beam', x0: x - 120, y0: -40, x, y, life: 0.45, max: 0.45, color: '255,140,40' });
        this.explosionFx(x, y, r); this.emit('sfx', 'boom');
      } else if (id === 'heal') { this.areas.push({ kind: 'heal', x, y, r, hps: sp.heal(L), t: sp.dur, side: this.playerSide }); this.emit('sfx', 'heal'); }
      else if (id === 'rage') { this.areas.push({ kind: 'rage', x, y, r, boost: sp.boost(L), t: sp.dur, side: this.playerSide }); this.emit('sfx', 'warcry'); }
      return true;
    }

    /* ================= RAID ================= */
    initRaid(op) {
      this.opponent = op;
      this.lootGot = { gold: 0, wood: 0, stone: 0, gems: 0 };
      this.timeLimit = C.RAID_TIME;
      for (const l of op.layout) {
        const b = this.addBuilding(l.type, l.level, l.tx, l.ty);
        if (b.def.cat === 'trap') b.hidden = true;
      }
      // Distribute the opponent's loot across its resource buildings.
      // Shares are renormalised over the categories that exist, so all advertised loot is obtainable.
      const share = { castle: 0.2, storage: 0.5, econ: 0.3 };
      for (const r of ['gold', 'wood', 'stone']) {
        const holders = this.buildings.filter(b => b.type === 'castle' || ((b.def.cat === 'storage' || b.def.cat === 'econ') && b.def.res === r));
        const cats = ['castle', 'storage', 'econ'].map(cat => [cat, holders.filter(b => (cat === 'castle' ? b.type === 'castle' : b.def.cat === cat))]).filter(([, hs]) => hs.length);
        const tot = cats.reduce((a, [cat]) => a + share[cat], 0);
        for (const [cat, hs] of cats) for (const b of hs) { b.loot = b.loot || {}; b.loot[r] = (b.loot[r] || 0) + op.loot[r] * share[cat] / tot / hs.length; }
      }
      const castleB = this.buildings.find(b => b.type === 'castle');
      castleB.loot.gems = op.loot.gems || 0;
      this.totalForStars = this.buildings.filter(b => this.countsForStars(b)).length;
      this.stars = 0; this.starFlags = { half: false, castle: false, all: false };
    }
    get destruction() { return this.mode === 'raid' ? Math.round(this.stats.destroyed / this.totalForStars * 100) : 0; }
    checkRaidStars(b) {
      const f = this.starFlags;
      const award = (k, text) => { if (!f[k]) { f[k] = true; this.stars++; this.emit('star', { stars: this.stars, text }); this.emit('sfx', 'star'); } };
      if (b.type === 'castle') award('castle', 'Castle destroyed');
      if (this.destruction >= 50) award('half', '50% destroyed');
      if (this.destruction >= 100) award('all', 'Total destruction');
    }
    updateRaid() {
      if (this.time >= this.timeLimit) this.finish(this.stars > 0 ? 'win' : 'lose', 'Time is up.');
    }
    retreat() { if (!this.result) this.finish(this.stars > 0 ? 'win' : 'lose', 'You retreated.'); }
    canStillAttack() {
      if (this.units.some(u => !u.dead && u.side === 'atk')) return true;
      if (Object.values(this.army).some(n => n > 0)) return true;
      if (this.heroesAvail.some(h => !this.heroesUsed[h])) return true;
      return false;
    }

    /* ================= DEFENSE ================= */
    initDefense(layout) {
      for (const l of layout) if (l.level > 0 && B[l.type].cat !== 'obstacle') this.addBuilding(l.type, l.level, l.tx, l.ty);
      this.layoutCopy = layout.filter(l => l.level > 0 && B[l.type].cat !== 'obstacle');

    if (ui.placeTower && b.mode === 'campaign' && ui.hoverTile) {
      const { tx, ty } = ui.hoverTile, ok = b.canPlaceTower(tx, ty);
      c.fillStyle = ok ? 'rgba(120,255,140,0.35)' : 'rgba(255,80,80,0.4)'; c.fillRect(tx * T, ty * T, 2 * T, 2 * T);
      A.drawBuilding(c, { type: ui.placeTower, level: b.towerBase[ui.placeTower], tx, ty }, { time, ghost: true });
      rangeRing(c, (tx + 1) * T, (ty + 1) * T, CH.BUILDINGS[ui.placeTower].atk.range * T, (CH.BUILDINGS[ui.placeTower].atk.min || 0) * T);
    }
    for (const a of b.areas) {
      const col = a.kind === 'fire' ? '255,110,40' : a.kind === 'heal' ? '255,220,120' : '255,70,150';
      A.glow(c, a.x, a.y, a.r, col, 0.35); c.beginPath(); c.arc(a.x, a.y, a.r, 0, Math.PI * 2); c.strokeStyle = 'rgba(' + col + ',0.7)'; c.lineWidth = 2; c.stroke();
    }
    const links = wallLinks(b.buildings, x => !x.dead);
    const ents = [];
    for (const bd of b.buildings) ents.push({ y: (bd.ty + bd.size) * T, b: bd });
    for (const u of b.units) if (!u.flying) ents.push({ y: u.y, u });
    ents.sort((p, q) => p.y - q.y);
    for (const e of ents) {
      if (e.b) {
        const bd = e.b;
        if (bd.dead) {
          if (bd.def.cat === 'trap') { A.ell(c, bd.cx, bd.cy, 9, 5, 'rgba(30,20,10,0.5)'); continue; }
          rubble(c, bd); continue;
        }
        A.drawBuilding(c, bd, { time, links: links.get(bd) || 0, angle: bd.angle, anim: bd.anim > 0 ? bd.anim / 0.2 : 0, hidden: bd.hidden, armed: bd.armed, frozen: bd.frozen > 0, hit: bd.hit > 0, fill: 0.7 });
        if (bd.hp < bd.maxHp && bd.def.cat !== 'trap') hpBar(c, bd.x + 4, bd.y - 6, bd.size * T - 8, bd.hp / bd.maxHp, b.mode === 'raid' ? '#e86a4a' : '#6fd36a');
        if (ui.selectedB === bd) rangeRing(c, bd.cx, bd.cy, bd.atk ? bd.atk.range : 0, bd.atk ? bd.atk.min : 0);
      } else A.drawUnit(c, e.u, e.u.side === b.playerSide, time);
    }
    for (const u of b.units) if (u.flying) A.drawUnit(c, u, u.side === b.playerSide, time);
    drawProjectiles(c, b);
    drawFx(c, b);
    if (ui.spellAim && ui.pointer) {
      const r = CH.SPELLS[ui.spellAim].radius * T;
      c.beginPath(); c.arc(ui.pointer.x, ui.pointer.y, r, 0, Math.PI * 2); c.fillStyle = 'rgba(255,240,170,0.15)'; c.fill();
      c.setLineDash([6, 5]); c.strokeStyle = 'rgba(255,240,170,0.9)'; c.lineWidth = 2; c.stroke(); c.setLineDash([]);
    }
  }
  function rubble(c, b) {
    const s = b.size * T;
    if (b.def.cat === 'wall') { A.ell(c, b.cx, b.cy + 4, 9, 5, 'rgba(90,80,70,0.7)'); return; }
    A.rrect(c, b.x + 4, b.y + 6, s - 8, s - 10, 6, 'rgba(50,40,32,0.55)');
    for (let i = 0; i < b.size * 4; i++) { const k = (b.id * 31 + i * 17) % 100 / 100, k2 = (b.id * 13 + i * 29) % 100 / 100; A.rect(c, b.x + 6 + k * (s - 14), b.y + 8 + k2 * (s - 16), 5, 4, i % 2 ? '#8a7e6a' : '#6a5e4a'); }
  }
  function drawProjectiles(c, b) {
    for (const p of b.proj) {
      switch (p.kind) {
        case 'arrow': { const a = p.a || 0; A.line(c, p.x - Math.cos(a) * 11, p.y - Math.sin(a) * 11, p.x, p.y, '#d9b16a', 1.6); A.line(c, p.x - Math.cos(a) * 2, p.y - Math.sin(a) * 2, p.x + Math.cos(a) * 2, p.y + Math.sin(a) * 2, '#eee', 2.2); break; }
        case 'ball': A.circle(c, p.x, p.y, 4.5, '#1c1b20'); A.circle(c, p.x - 1.5, p.y - 1.5, 1.5, 'rgba(255,255,255,0.4)'); break;
        case 'orb': A.glow(c, p.x, p.y, 12, '190,150,255', 0.8); A.circle(c, p.x, p.y, 3, '#fff'); break;
        case 'frost': A.glow(c, p.x, p.y, 11, '170,225,255', 0.85); A.circle(c, p.x, p.y, 3, '#fff'); break;
        case 'fire': A.glow(c, p.x, p.y, 12, '255,130,40', 0.85); A.circle(c, p.x, p.y, 3, '#ffe9a0'); break;
        case 'shadow': A.glow(c, p.x, p.y, 11, '140,90,230', 0.8); A.circle(c, p.x, p.y, 2.8, '#9effa8'); break;
        case 'bolt': { const a = p.a || 0; A.line(c, p.x - Math.cos(a) * 18, p.y - Math.sin(a) * 18, p.x, p.y, '#6b4a2a', 3); A.line(c, p.x - Math.cos(a) * 3, p.y - Math.sin(a) * 3, p.x + Math.cos(a) * 3, p.y + Math.sin(a) * 3, '#ddd', 4); break; }
        case 'shell': A.ell(c, p.x, p.y, 5, 2.5, 'rgba(0,0,0,0.3)'); A.circle(c, p.x, p.y - p.z, 5.5, '#1c1b20'); A.circle(c, p.x + 3, p.y - p.z - 5, 1.6, Math.random() > 0.5 ? '#ffd04a' : '#ff7a2a'); break;
      }
    }
  }
  function drawFx(c, b) {
    for (const f of b.fx) {
      const t = f.life / f.max;
      switch (f.kind) {
        case 'spark': c.globalAlpha = t; A.circle(c, f.x, f.y, f.size * (0.5 + t * 0.5), f.color); break;
        case 'smoke': c.globalAlpha = t * 0.6; A.circle(c, f.x, f.y, f.size * (1.6 - t * 0.6), f.color); break;
        case 'ring': c.globalAlpha = t; c.beginPath(); c.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - t), 0, Math.PI * 2); c.strokeStyle = f.color; c.lineWidth = f.w * t + 0.5; c.stroke(); break;
        case 'flash': c.globalAlpha = 1; A.glow(c, f.x, f.y, f.r, f.color, 0.6 * t); break;
        case 'bolt': {
          c.globalAlpha = t; c.beginPath(); c.moveTo(f.pts[0].x, f.pts[0].y);
          for (let i = 1; i < f.pts.length; i++) { const a = f.pts[i - 1], q = f.pts[i]; for (let k = 1; k < 4; k++) c.lineTo(a.x + (q.x - a.x) * k / 4 + (Math.random() - 0.5) * 10, a.y + (q.y - a.y) * k / 4 + (Math.random() - 0.5) * 10); c.lineTo(q.x, q.y); }
          c.strokeStyle = f.color; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke(); break;
        }
        case 'beam': { c.globalAlpha = t; c.beginPath(); c.moveTo(f.x0, f.y0); c.lineTo(f.x, f.y); c.strokeStyle = 'rgba(' + f.color + ',0.9)'; c.lineWidth = 10 * t + 2; c.lineCap = 'round'; c.stroke(); A.glow(c, f.x, f.y, 40, f.color, 0.7 * t); break; }
        case 'text': c.globalAlpha = Math.min(1, t * 2); c.font = '700 12px system-ui, sans-serif'; c.textAlign = 'center'; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.6)'; c.strokeText(f.text, f.x, f.y); c.fillStyle = f.color; c.fillText(f.text, f.x, f.y); break;
      }
    }
    c.globalAlpha = 1;
  }

  /** Mini map of a layout (raid target previews, campaign stage previews). */
  function layoutPreview(cv, layout, opts = {}) {
    const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    cv.width = w * dpr; cv.height = h * dpr;
    const sc = Math.min(w / WW, h / WH) * dpr;
    ctx.setTransform(sc, 0, 0, sc, (w * dpr - WW * sc) / 2, (h * dpr - WH * sc) / 2);
    ctx.drawImage(opts.terrain || terrain('raid' + (opts.cl || 1), { area: opts.area, seed: 50 + (opts.cl || 1) }), 0, 0);
    const list = layout.slice().sort((a, b) => a.ty - b.ty);
    const links = wallLinks(list, () => true);
    for (const b of list) if (CH.BUILDINGS[b.type].cat !== 'trap') A.drawBuilding(ctx, b, { time: 1, links: links.get(b) || 0, fill: 0.8 });
  }

  return { View, drawHome, drawBattle, layoutPreview, terrain, WW, WH };
})();

    check: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    gear: '<svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.5 4.6-1.9.6-.6 1.5.9 1.8-1.6 1.6-1.8-.9-1.5.6-.6 1.9h-2.3l-.6-1.9-1.5-.6-1.8.9-1.6-1.6.9-1.8-.6-1.5-1.9-.6v-2.3l1.9-.6.6-1.5-.9-1.8 1.6-1.6 1.8.9 1.5-.6.6-1.9h2.3l.6 1.9 1.5.6 1.8-.9 1.6 1.6-.9 1.8.6 1.5 1.9.6z" fill="currentColor"/></svg>',

    map: '<svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="#d8c08a" stroke="#5a4320" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="#5a4320" stroke-width="1.2"/><path d="m11 10 2 2m0-2-2 2" stroke="#b02a2a" stroke-width="1.6"/></svg>',
    swords: '<svg viewBox="0 0 24 24"><path d="M4 3l9 9M20 3l-9 9" stroke="#d8dce4" stroke-width="2.6" stroke-linecap="round"/><path d="M6 16l-3 3 2 2 3-3M18 16l3 3-2 2-3-3M8 14l2 2M16 14l-2 2" stroke="#c9962e" stroke-width="2.2" stroke-linecap="round"/></svg>',
    army: '<svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3" fill="#e8c39a"/><circle cx="16" cy="7" r="3" fill="#e8c39a"/><path d="M3 20c0-4 2-7 5-7s5 3 5 7zM11 20c0-4 2-7 5-7s5 3 5 7z" fill="#3a62c9" stroke="#1a2a5a" stroke-width="1.2"/></svg>',
    more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg>',

    fireball: '<svg viewBox="0 0 24 24"><circle cx="13" cy="13" r="6" fill="#ff8a2a"/><circle cx="13" cy="13" r="3" fill="#ffe08a"/><path d="M8 8 3 3M10 6 6 2M6 10 2 6" stroke="#ff8a2a" stroke-width="2" stroke-linecap="round"/></svg>',
    heal: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffe08a" stroke="#7a5a12" stroke-width="1.4"/><path d="M12 7v10M7 12h10" stroke="#3a8a3a" stroke-width="3" stroke-linecap="round"/></svg>',
    rage: '<svg viewBox="0 0 24 24"><path d="M12 2c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3-1-3 0-5 0-7z" fill="#ff4a8a" stroke="#6a0a2a" stroke-width="1.3"/></svg>',
  };
  const icon = (n, cls) => '<i class="ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + (ICONS[n] || '') + '</i>';

  /** Cost chips; red when you can't afford that part. */
  function cost(c, save) {
    const parts = [];
    for (const r of ['gold', 'wood', 'stone', 'gems', 'runes']) if (c[r]) parts.push('<span class="chip' + (save && save.res[r] < c[r] ? ' short' : '') + '">' + icon(r) + CH.util.fmt(c[r]) + '</span>');
    return parts.join('') || '<span class="chip">Free</span>';
  }
  function reward(rw) {
    const parts = [];
    for (const r of ['gold', 'wood', 'stone', 'gems', 'runes', 'xp']) if (rw[r]) parts.push('<span class="chip">' + icon(r) + '+' + CH.util.fmt(rw[r]) + (r === 'xp' ? ' XP' : '') + '</span>');
    return parts.join('');
  }

  function toast(text, kind = 'info') {
    const box = $('toasts');
    const n = document.createElement('div');
    n.className = 'toast toast-' + kind; n.textContent = text;
    box.appendChild(n);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => n.classList.add('out'), 3000);
    setTimeout(() => n.remove(), 3500);
  }

  /* ---------- Modal ---------- */
  let modalOnClose = null;
  function modal(html, opts = {}) {
    const m = $('modal');
    m.innerHTML = '<div class="modal-card ' + (opts.cls || '') + '" role="dialog" aria-modal="true">' + (opts.noClose ? '' : '<button class="x-btn" data-close aria-label="Close">' + icon('close') + '</button>') + html + '</div>';
    m.classList.remove('hidden');
    modalOnClose = opts.onClose || null;
    m.onclick = e => {
      if (e.target === m && !opts.noClose) closeModal();
      else if (e.target.closest('[data-close]')) closeModal();
      else if (opts.onClick) opts.onClick(e);
    };
    paintCanvases(m);
    return m;
  }
  function closeModal() { const m = $('modal'); m.classList.add('hidden'); m.innerHTML = ''; const f = modalOnClose; modalOnClose = null; if (f) f(); }
  const modalOpen = () => !$('modal').classList.contains('hidden');

  /* ---------- Sheets (full screens) ---------- */
  let sheetStack = [];
  function sheet(name, arg, push = true) {
    const fn = CH.Screens[name];
    if (!fn) return;
    const s = $('sheet');
    if (push && !(sheetStack.length && sheetStack[sheetStack.length - 1].name === name)) sheetStack.push({ name, arg });
    else if (sheetStack.length) sheetStack[sheetStack.length - 1] = { name, arg };
    const out = fn(arg);
    s.innerHTML = '<div class="sheet-inner">' +
      '<header class="sheet-head"><button class="btn-back" data-back>' + icon('back') + '<span>Back</span></button><h2>' + out.title + '</h2>' + resBar() + '</header>' +
      '<div class="sheet-body">' + out.html + '</div></div>';
    s.classList.remove('hidden');
    s.dataset.screen = name;
    s.onclick = e => {
      if (e.target.closest('[data-back]')) { back(); return; }
      const b = e.target.closest('[data-act]');
      if (b && !b.disabled && out.on && out.on[b.dataset.act]) { CH.Audio.play('click'); out.on[b.dataset.act](b, e); }
    };
    s.oninput = out.onInput || null;
    if (out.after) out.after(s);
    paintCanvases(s);
    s.scrollTop = 0;
  }
  function refreshSheet() {
    const s = $('sheet');
    if (s.classList.contains('hidden') || !sheetStack.length) return;
    const top = s.querySelector('.sheet-body') ? s.querySelector('.sheet-body').scrollTop : 0;
    const cur = sheetStack[sheetStack.length - 1];
    sheet(cur.name, cur.arg, false);
    const body = s.querySelector('.sheet-body'); if (body) body.scrollTop = top;
  }
  function back() {
    sheetStack.pop();
    if (sheetStack.length) { const p = sheetStack[sheetStack.length - 1]; sheet(p.name, p.arg, false); }
    else closeSheets();
  }
  function closeSheets() { sheetStack = []; const s = $('sheet'); s.classList.add('hidden'); s.innerHTML = ''; CH.Home && CH.Home.refreshHud(true); }
  const sheetOpen = () => !$('sheet').classList.contains('hidden');
  const currentSheet = () => (sheetStack.length ? sheetStack[sheetStack.length - 1].name : null);

  function resBar() {
    const s = CH.App.save;
    return '<div class="mini-res">' + ['gold', 'wood', 'stone', 'gems'].map(r => '<span>' + icon(r) + CH.util.fmt(s.res[r]) + '</span>').join('') + '</div>';
  }

  /** Paints any canvas with data-unit / data-building / data-layout attributes. */
  function paintCanvases(root) {
    requestAnimationFrame(() => {
      root.querySelectorAll('canvas[data-unit]').forEach(cv => CH.Art.unitIcon(cv, cv.dataset.unit, +cv.dataset.size || 10, { bg: cv.dataset.bg }));
      root.querySelectorAll('canvas[data-building]').forEach(cv => CH.Art.buildingIcon(cv, cv.dataset.building, +cv.dataset.level || 1));

  return { $, esc, icon, ICONS, cost, reward, toast, modal, closeModal, modalOpen, sheet, refreshSheet, back, closeSheets, sheetOpen, currentSheet, paintCanvases, painters: {} };
})();

  <script>/* js/ui/home.js */
/* =====================================================================
 * Crownhold — ui/home.js
 * The interactive kingdom: HUD, goals, dock, selecting buildings,
 * the building panel, the upgrade dialog, the build shop, and placing
 * or moving buildings (tap, drag, or the ✓/✗ bar).
 * ===================================================================== */
CH.Home = (function () {
  const UI = CH.UI, S = CH.State, B = CH.BUILDINGS, U = CH.util, T = CH.CONFIG.T, $ = UI.$;
  const st = { selected: null, ghost: null, moving: null, floaters: [], hud: {} };
  const save = () => CH.App.save;
  const persist = () => CH.App.persist();

  /* ---------------- HUD ---------------- */
  function buildHud() {
    $('hud').innerHTML =
      '<button class="player" id="hud-player" aria-label="Player profile"><span class="lvl" id="hud-lvl">1</span><span class="pname"><b id="hud-name"></b><span class="xpbar"><i id="hud-xp"></i></span></span></button>' +
      '<div class="res-row">' + ['gold', 'wood', 'stone'].map(r => '<button class="res" data-res="' + r + '" title="' + r[0].toUpperCase() + r.slice(1) + '">' + UI.icon(r) + '<span class="res-txt"><b id="hud-' + r + '">0</b><span class="cap"><i id="hud-' + r + '-bar"></i></span></span></button>').join('') +
      '<button class="res gem" data-res="gems" title="Gems">' + UI.icon('gems') + '<b id="hud-gems">0</b></button>' +
      '<button class="res gem" data-res="runes" title="Runes (rare material)">' + UI.icon('runes') + '<b id="hud-runes">0</b></button></div>' +
      '<button class="icon-btn" id="hud-settings" aria-label="Settings">' + UI.icon('gear') + '</button>';
    $('hud').onclick = e => {
      if (e.target.closest('#hud-player')) UI.sheet('profile');
      else if (e.target.closest('#hud-settings')) UI.sheet('settings');
      else if (e.target.closest('[data-res]')) UI.sheet('resources');
    };
    $('dock').innerHTML =
      '<button class="dock-btn big" data-dock="campaign">' + UI.icon('map') + '<span>Campaign</span></button>' +
      '<button class="dock-btn big red" data-dock="endless">' + UI.icon('swords') + '<span>Endless</span></button>' +
      '<button class="dock-btn" data-dock="build">' + UI.icon('hammer') + '<span>Build</span></button>' +
      '<button class="dock-btn" data-dock="army">' + UI.icon('army') + '<span>Army</span></button>' +
      '<button class="dock-btn" data-dock="heroes">' + UI.icon('crown') + '<span>Heroes</span></button>' +
      '<button class="dock-btn" data-dock="more">' + UI.icon('more') + '<span>More</span></button>';
    $('dock').onclick = e => {
      const b = e.target.closest('[data-dock]'); if (!b) return;
      CH.Audio.play('click'); cancelPlacement(); deselect();
      const k = b.dataset.dock;
      if (k === 'build') UI.sheet('shop');
      else if (k === 'more') moreMenu();
      else UI.sheet(k);
    };
    $('sidebar').onclick = e => {
      const g = e.target.closest('[data-goal]');
      if (g) { CH.Audio.play('click'); runGoal(JSON.parse(g.dataset.goal)); return; }
      if (e.target.closest('#collect-all')) collectAll();
      if (e.target.closest('#builders-chip')) UI.sheet('buildings');
    };
    $('placebar').onclick = e => {
      if (e.target.closest('[data-place=ok]')) confirmPlacement();
      else if (e.target.closest('[data-place=no]')) cancelPlacement();
    };
    $('panel').onclick = onPanelClick;
  }
  function moreMenu() {
    UI.modal('<h3>Kingdom</h3><div class="more-grid">' +
      [['buildings', 'hammer', 'Buildings'], ['lab', 'flask', 'Research'], ['resources', 'gold', 'Resources'], ['profile', 'crown', 'Profile'], ['settings', 'gear', 'Settings'], ['redeem', 'gems', 'Redeem code'], ['howto', 'map', 'How to play']]
        .map(([k, i, n]) => '<button class="more-btn" data-more="' + k + '">' + UI.icon(i) + '<span>' + n + '</span></button>').join('') + '</div>',
    { onClick: e => { const b = e.target.closest('[data-more]'); if (b) { UI.closeModal(); UI.sheet(b.dataset.more); } } });
  }
  function runGoal(g) {
    if (g.act === 'build') UI.sheet('shop', g.type);
    else if (g.act === 'campaign') UI.sheet('campaign');
    else if (g.act === 'endless') UI.sheet('endless');
    else if (g.act === 'castle') { select(S.castle(save())); CH.App.view.frame(S.area(save()), 2); }
  }

  function setText(id, v) { if (st.hud[id] !== v) { st.hud[id] = v; const n = $(id); if (n) n.textContent = v; } }
  function refreshHud(force) {
    const s = save();
    if (force) st.hud = {};
    for (const r of ['gold', 'wood', 'stone']) {
      setText('hud-' + r, U.fmt(s.res[r]));
      const f = Math.min(1, s.res[r] / S.capacity(s, r));
      const key = 'bar' + r, v = Math.round(f * 100);
      if (st.hud[key] !== v) { st.hud[key] = v; const el = $('hud-' + r + '-bar'); if (el) { el.style.width = v + '%'; el.classList.toggle('full', v >= 100); } }
    }
    setText('hud-gems', U.fmt(s.res.gems)); setText('hud-runes', U.fmt(s.res.runes));
    setText('hud-lvl', String(s.player.level)); setText('hud-name', s.player.name);
    const xp = Math.round(s.player.xp / S.xpFor(s.player.level) * 100);
    if (st.hud.xp !== xp) { st.hud.xp = xp; $('hud-xp').style.width = xp + '%'; }
    // Sidebar: builders, collect, goals
    const goals = S.goals(s).slice(0, 3);
    const sideKey = S.busy(s) + '/' + S.builders(s) + '|' + goals.map(g => g.text).join('|') + '|' + canCollect();
    if (st.hud.side !== sideKey || force) {
      st.hud.side = sideKey;
      $('sidebar').innerHTML =
        '<div class="side-row"><button class="chip-btn" id="builders-chip" title="Builders busy / total">' + UI.icon('hammer') + 'Builders ' + (S.builders(s) - S.busy(s)) + '/' + S.builders(s) + ' free</button>' +
        (canCollect() ? '<button class="chip-btn gold" id="collect-all">' + UI.icon('gold') + 'Collect all</button>' : '') + '</div>' +
        (goals.length ? '<div class="goals"><h4>Next goals</h4>' + goals.map(g => '<button class="goal" data-goal=\'' + UI.esc(JSON.stringify(g)) + '\'>' + UI.esc(g.text) + '</button>').join('') + '</div>' : '');
    }
    if (st.selected) renderPanel(false);
  }
  const canCollect = () => save().buildings.some(b => B[b.type].cat === 'econ' && b.buf >= 10);

  /* ---------------- Selection & panel ---------------- */
  function buildingAt(x, y) {
    const tx = Math.floor(x / T), ty = Math.floor(y / T);
    const s = save();
    for (let i = s.buildings.length - 1; i >= 0; i--) { const b = s.buildings[i], sz = B[b.type].size; if (tx >= b.tx && ty >= b.ty && tx < b.tx + sz && ty < b.ty + sz) return b; }
    return null;
  }
  function select(b) { st.selected = b; st.panelKey = ''; renderPanel(true); }
  function deselect() { st.selected = null; $('panel').classList.add('hidden'); }

  function statLines(type, L) {
    const d = B[type], out = [];
    if (!L) return out;
    if (d.hp && d.cat !== 'trap' && d.cat !== 'obstacle') out.push(['Health', U.fmt(d.hp(L))]);
    if (d.prod) out.push(['Production', U.fmt(d.prod(L) * 60) + ' / hour'], ['Holds', U.fmt(d.buf(L))]);
    if (d.cap && type !== 'castle') out.push(['Storage', '+' + U.fmt(d.cap(L))]);
    if (type === 'castle') out.push(['Storage (each)', U.fmt(d.cap(L))], ['Kingdom size', CH.CONFIG.AREA[L - 1].join(' × ')]);
    if (d.atk) out.push(['Damage', U.fmt(d.atk.dmg(L)) + (d.atk.splash ? ' (area)' : '')], ['Attacks / sec', d.atk.rate], ['Range', d.atk.range + ' tiles'], ['Targets', (d.atk.ground ? 'Ground' : '') + (d.atk.ground && d.atk.air ? ' & ' : '') + (d.atk.air ? 'Air' : '')]);
    if (d.trap) out.push(['Damage', U.fmt(d.trap.dmg ? d.trap.dmg(L) : d.trap.dps(L) + '/s')]);
    if (type === 'barracks') out.push(['Army space', d.housing(L)], ['Unlocks', CH.TROOP_ORDER.filter(t => CH.TROOPS[t].unlock <= L).length + ' troop types']);
    if (type === 'heroHall') out.push(['Heroes', CH.HERO_ORDER.filter(h => CH.HEROES[h].unlock <= L).length], ['Hero level cap', L * 2]);
    if (type === 'lab') out.push(['Research cap', 'Level ' + CH.RESEARCH.maxLevel(L)]);
    return out;
  }

  function renderPanel(force) {
    const b = st.selected, s = save();
    if (!b || !s.buildings.includes(b)) return deselect();
    const now = Date.now();
    const key = b.level + '|' + (b.job ? Math.ceil((b.job.ends - now) / 1000) : '-') + '|' + Math.floor(b.buf / 5) + '|' + s.res.gold + s.res.wood + s.res.stone + s.res.gems + '|' + S.freeBuilders(s);
    if (!force && key === st.panelKey) return;
    st.panelKey = key;
    const d = B[b.type];
    let status = '', actions = [];
    if (d.cat === 'obstacle') {
      const cl = CH.OBSTACLE_CLEAR[b.type];
      status = b.job ? 'Clearing… ' + U.time((b.job.ends - now) / 1000) : 'Clear it for ' + UI.reward(cl.yield) + ' and a chance of gems.';
      if (!b.job) actions.push('<button class="btn btn-gold" data-p="clear">Clear ' + UI.cost(cl.cost, s) + '</button>');
    } else {
      if (b.job) status = (b.job.kind === 'build' ? 'Building' : 'Upgrading to level ' + b.job.to) + ' · ' + U.time((b.job.ends - now) / 1000) + ' left';
      if (d.cat === 'econ' && b.level) status = (status ? status + ' · ' : '') + U.fmt(b.buf) + ' / ' + U.fmt(d.buf(b.level)) + ' ready';
      if (b.job) actions.push('<button class="btn btn-gem" data-p="speed"' + (s.res.gems >= S.speedUpCost(b) ? '' : ' disabled') + '>Finish now ' + UI.icon('gems') + S.speedUpCost(b) + '</button>');
      if (d.cat === 'econ' && b.level) actions.push('<button class="btn" data-p="collect"' + (b.buf >= 1 ? '' : ' disabled') + '>Collect</button>');
      if (!b.job && d.maxLevel > 1) {
        const why = S.upgradeBlocker(s, b);
        const maxed = b.level >= Math.min(d.maxLevel, b.type === 'castle' ? 8 : 99);
        actions.push(maxed ? '<button class="btn" disabled>Max level</button>' : '<button class="btn btn-gold" data-p="upgrade">Upgrade…</button>');
        if (why && !maxed && why !== 'Not enough resources') status = (status ? status + ' · ' : '') + why;
      }
      if (b.type === 'barracks') actions.push('<button class="btn" data-p="army">Train</button>');
      if (b.type === 'heroHall') actions.push('<button class="btn" data-p="heroes">Heroes</button>');
      if (b.type === 'lab') actions.push('<button class="btn" data-p="lab">Research</button>');
      if (b.type === 'wall') actions.push('<button class="btn" data-p="walls">Upgrade all L' + b.level + '</button>');
      actions.push('<button class="btn btn-quiet" data-p="move">Move</button>');
    }
    $('panel').innerHTML =
      '<div class="panel-head"><canvas data-building="' + b.type + '" data-level="' + Math.max(1, b.level) + '"></canvas><div><h3>' + d.name + (d.maxLevel > 1 ? ' <span class="lv">Level ' + b.level + '</span>' : '') + '</h3><p>' + (status || d.desc) + '</p></div>' +
      '<button class="x-btn" data-p="close" aria-label="Close">' + UI.icon('close') + '</button></div>' +
      '<dl class="stats">' + statLines(b.type, b.level).map(([k, v]) => '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>').join('') + '</dl>' +
      '<div class="panel-actions">' + actions.join('') + '</div>';
    $('panel').classList.remove('hidden');
    UI.paintCanvases($('panel'));
  }

  function onPanelClick(e) {
    const a = e.target.closest('[data-p]'); if (!a || a.disabled) return;
    const b = st.selected, s = save();
    CH.Audio.play('click');
    switch (a.dataset.p) {
      case 'close': deselect(); break;
      case 'collect': collectOne(b); break;
      case 'speed': if (S.speedUp(s, b.id)) { CH.App.handleEvents(S.tick(s)); persist(); select(b); } break;
      case 'upgrade': upgradeDialog(b); break;
      case 'move': startMove(b); break;
      case 'army': UI.sheet('army'); break;
      case 'heroes': UI.sheet('heroes'); break;
      case 'lab': UI.sheet('lab'); break;
      case 'clear': { const r = S.clearObstacle(s, b.id); if (!r.ok) { UI.toast(r.reason, 'warn'); CH.Audio.play('error'); } else { CH.Audio.play('build'); persist(); select(b); } break; }
      case 'walls': {
        let n = 0;
        for (const w of s.buildings.filter(x => x.type === 'wall' && x.level === b.level)) if (S.upgrade(s, w.id).ok) n++;
        if (n) { UI.toast(n + ' wall' + (n > 1 ? 's' : '') + ' upgraded', 'good'); CH.Audio.play('upgrade'); persist(); } else UI.toast('Not enough stone', 'warn');
        select(b); break;
      }
    }
  }

  /** The upgrade interface: current vs next level, cost and time. */
  function upgradeDialog(b) {
    const s = save(), d = B[b.type], L = b.level + 1;
    const cur = Object.fromEntries(statLines(b.type, b.level)), nxt = statLines(b.type, L);
    const why = S.upgradeBlocker(s, b);
    const unlocks = b.type === 'castle' ? '<div class="unlocks"><h4>Unlocks at castle level ' + L + '</h4><ul>' + S.unlocksAt(L).map(x => '<li>' + UI.esc(x) + '</li>').join('') + '</ul></div>' : '';
    UI.modal('<div class="up-head"><canvas data-building="' + b.type + '" data-level="' + L + '"></canvas><div><h3>Upgrade ' + d.name + '</h3><p>Level ' + b.level + ' → ' + L + (d.special ? '<br><small>' + d.special + '</small>' : '') + '</p></div></div>' +
      '<dl class="stats compare">' + nxt.map(([k, v]) => '<div><dt>' + k + '</dt><dd>' + (cur[k] !== undefined && String(cur[k]) !== String(v) ? '<s>' + cur[k] + '</s> ' : '') + '<b>' + v + '</b></dd></div>').join('') + '</dl>' + unlocks +
      '<div class="up-cost"><div>' + UI.cost(d.cost(L), s) + '</div><span class="chip">' + UI.icon('time') + (d.instant ? 'Instant' : U.time(d.time(L))) + '</span></div>' +
      (why ? '<p class="warn">' + why + '</p>' : '') +
      '<button class="btn btn-gold btn-lg btn-block" data-up' + (why ? ' disabled' : '') + '>Upgrade</button>',
    { onClick: e => {
      if (!e.target.closest('[data-up]')) return;
      const r = S.upgrade(s, b.id);
      if (r.ok) { CH.Audio.play(r.instant ? 'upgrade' : 'build'); persist(); UI.closeModal(); select(b); refreshHud(true); }
      else { UI.toast(r.reason, 'warn'); CH.Audio.play('error'); }
    } });
  }

  /* ---------------- Collecting ---------------- */
  function floater(x, y, text, color) { st.floaters.push({ x, y, text, color, life: 1.4 }); }
  function collectOne(b) {
    const d = B[b.type], amt = S.collect(save(), b.id);
    if (amt > 0) { floater((b.tx + 1) * T, b.ty * T, '+' + U.fmt(amt), d.res === 'gold' ? '#ffe07a' : d.res === 'wood' ? '#e8b878' : '#e0ddd6'); CH.Audio.play('collect'); persist(); refreshHud(); }
    else if (b.buf >= 1) { UI.toast('Your ' + (d.res === 'gold' ? 'gold vaults are' : d.res === 'wood' ? 'timber yards are' : 'stone depots are') + ' full. Build or upgrade storage.', 'warn'); CH.Audio.play('error'); }
  }
  function collectAll() {
    const s = save(), before = s.buildings.filter(b => B[b.type].cat === 'econ').map(b => ({ b, buf: b.buf }));
    const got = S.collectAll(s);
    for (const { b, buf } of before) if (buf - b.buf >= 1) floater((b.tx + 1) * T, b.ty * T, '+' + U.fmt(buf - b.buf), '#ffe07a');
    if (got.gold + got.wood + got.stone > 0) { CH.Audio.play('collect'); persist(); refreshHud(true); } else UI.toast('Storage is full. Upgrade your storage buildings.', 'warn');
  }

  /* ---------------- Placement & moving ---------------- */
  function nearestFree(type, cx, cy) {
    const s = save(), sz = B[type].size;
    let best = null, bd = Infinity;
    const a = S.area(s);
    for (let ty = a.y; ty <= a.y + a.h - sz; ty++) for (let tx = a.x; tx <= a.x + a.w - sz; tx++) {
      if (!S.tilesFree(s, tx, ty, sz)) continue;
      const d = (tx + sz / 2 - cx) ** 2 + (ty + sz / 2 - cy) ** 2;
      if (d < bd) { bd = d; best = { tx, ty }; }
    }
    return best;
  }
  function startPlacement(type) {
    const s = save();
    const why = S.buildBlocker(s, type);
    if (why) { UI.toast(why, 'warn'); CH.Audio.play('error'); return; }
    UI.closeSheets(); deselect();
    const v = CH.App.view, c = v.toWorld(v.canvas.getBoundingClientRect().left + v.w / 2, v.canvas.getBoundingClientRect().top + v.h / 2);
    const spot = nearestFree(type, c.x / T, c.y / T);
    if (!spot) { UI.toast('No free space. Clear obstacles or upgrade the castle to expand.', 'warn'); return; }
    st.ghost = { type, tx: spot.tx, ty: spot.ty, valid: true, mode: 'new' };
    showPlacebar(B[type].name + ' · ' + UI.cost(S.buildCost(s, type), s));
  }
  function startMove(b) {
    st.moving = b;
    st.ghost = { type: b.type, level: b.level, tx: b.tx, ty: b.ty, valid: true, mode: 'move', id: b.id };
    $('panel').classList.add('hidden');
    showPlacebar('Move ' + B[b.type].name);
  }
  function showPlacebar(label) {
    $('placebar').innerHTML = '<span>' + label + '</span><button class="round-btn ok" data-place="ok" aria-label="Confirm">' + UI.icon('check') + '</button><button class="round-btn no" data-place="no" aria-label="Cancel">' + UI.icon('close') + '</button>';
    $('placebar').classList.remove('hidden');
  }
  function setGhost(x, y) {
    const g = st.ghost, sz = B[g.type].size;
    g.tx = Math.round(x / T - sz / 2); g.ty = Math.round(y / T - sz / 2);
    g.valid = S.tilesFree(save(), g.tx, g.ty, sz, g.mode === 'move' ? g.id : undefined);
  }
  function confirmPlacement() {
    const g = st.ghost; if (!g) return;
    const s = save();
    if (g.mode === 'move') {
      if (S.move(s, g.id, g.tx, g.ty)) { CH.Audio.play('place'); persist(); const b = st.moving; cancelPlacement(); select(b); }
      else { UI.toast('That spot is blocked', 'warn'); CH.Audio.play('error'); }
      return;
    }
    const r = S.build(s, g.type, g.tx, g.ty);
    if (!r.ok) { UI.toast(r.reason, 'warn'); CH.Audio.play('error'); if (r.reason !== 'That spot is blocked') cancelPlacement(); return; }
    CH.Audio.play(B[g.type].instant ? 'place' : 'build');
    persist(); refreshHud(true);
    // Walls and traps keep placing; everything else selects the new building.
    if (B[g.type].instant && !S.buildBlocker(s, g.type)) {
      const nx = g.tx + (B[g.type].cat === 'wall' ? 1 : 2);
      st.ghost = { ...g, tx: nx, ty: g.ty };
      st.ghost.valid = S.tilesFree(s, st.ghost.tx, st.ghost.ty, B[g.type].size);
      showPlacebar(B[g.type].name + ' · ' + UI.cost(S.buildCost(s, g.type), s) + ' · ' + S.countOf(s, g.type) + '/' + S.maxCount(s, g.type));
    } else { cancelPlacement(); select(r.building); }
  }
  function cancelPlacement() { st.ghost = null; st.moving = null; $('placebar').classList.add('hidden'); }

  /* ---------------- Pointer handler for the kingdom view ---------------- */
  const handler = {
    tap(p, e) {
      if (st.ghost) {
        const g = st.ghost, sz = B[g.type].size;
        const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
        const onGhost = tx >= g.tx && ty >= g.ty && tx < g.tx + sz && ty < g.ty + sz;
        if (e.pointerType === 'mouse' || onGhost) { if (e.pointerType === 'mouse') setGhost(p.x, p.y); confirmPlacement(); }
        else setGhost(p.x, p.y);
        return;
      }
      const b = buildingAt(p.x, p.y);
      if (!b) return deselect();
      if (B[b.type].cat === 'econ' && b.level && b.buf >= Math.max(10, B[b.type].buf(b.level) * 0.08) && st.selected !== b) { collectOne(b); select(b); return; }
      CH.Audio.play('click');
      select(b);
    },
    hover(p) { if (st.ghost && p && st.ghost.mode === 'new') setGhost(p.x, p.y); },
    dragStart(p) {
      if (st.ghost) { const g = st.ghost, sz = B[g.type].size, tx = Math.floor(p.x / T), ty = Math.floor(p.y / T); if (tx >= g.tx - 1 && ty >= g.ty - 1 && tx <= g.tx + sz && ty <= g.ty + sz) { st.dragGhost = true; return true; } return false; }
      const b = buildingAt(p.x, p.y);
      if (b && b === st.selected) { startMove(b); st.dragGhost = true; st.dragRelease = true; return true; }
      return false;
    },
    dragMove(p) { if (st.ghost) setGhost(p.x, p.y); },
    dragEnd() { st.dragGhost = false; if (st.dragRelease) { st.dragRelease = false; if (st.ghost && st.ghost.valid) confirmPlacement(); } },
    cancel() { cancelPlacement(); deselect(); },
  };

  function update(dt) {
    for (const f of st.floaters) { f.life -= dt; f.y -= 28 * dt; }
    st.floaters = st.floaters.filter(f => f.life > 0);
  }

  return { buildHud, refreshHud, handler, state: st, update, select, deselect, startPlacement, cancelPlacement, statLines, upgradeDialog };
})();

</script>
  <script>/* js/ui/screens.js */
/* =====================================================================
 * Crownhold — ui/screens.js
 * Full-screen sheets. Each returns { title, html, on: {act: fn}, after }.
 * Buttons use data-act="name" and are dispatched by CH.UI.sheet().
 * ===================================================================== */
CH.Screens = (function () {
  const UI = CH.UI, S = CH.State, B = CH.BUILDINGS, U = CH.util, T = CH.CONFIG.T;
  const save = () => CH.App.save;
  const persist = () => CH.App.persist();
  const icon = UI.icon, esc = UI.esc;
  const stars = (n, max = 3) => '<span class="stars">' + Array.from({ length: max }, (_, i) => '<span class="star' + (i < n ? ' on' : '') + '">' + UI.ICONS.star + '</span>').join('') + '</span>';
  const fail = r => { UI.toast(r.reason || 'Not possible', 'warn'); CH.Audio.play('error'); };
  const roadsPx = tpl => tpl.paths.map(p => p.pts.map(([x, y]) => ({ x: (x + 0.5) * T, y: (y + 0.5) * T })));

  /* ---------------- Build shop ---------------- */
  function shop(focus) {
    const s = save();
    const tab = focus ? CH.BUILD_MENU.find(m => m.types.includes(focus)).id : (shop.tab || 'econ');
    shop.tab = tab;
    const cat = CH.BUILD_MENU.find(m => m.id === tab);
    const cards = cat.types.map(t => {
      const d = B[t], why = S.buildBlocker(s, t), cnt = S.countOf(s, t), max = S.maxCount(s, t);
      const locked = d.unlock > S.castleLevel(s);
      return '<button class="shop-card' + (why ? ' blocked' : '') + (focus === t ? ' focus' : '') + '" data-act="place" data-type="' + t + '"' + (locked ? ' disabled' : '') + '>' +
        '<canvas data-building="' + t + '" data-level="1"></canvas><b>' + d.name + '</b>' +
        (locked ? '<span class="req">' + icon('lock') + 'Castle level ' + d.unlock + '</span>' :
          '<span class="count">' + cnt + ' / ' + max + ' built</span><span class="costs">' + UI.cost(S.buildCost(s, t), s) + '</span>' +
          '<span class="meta">' + icon('time') + (d.instant || t === 'builderHut' ? 'Instant' : U.time(d.time(1))) + '</span>' +
          (why && why !== 'Not enough resources' ? '<span class="req">' + why + '</span>' : '')) +
        '<span class="desc">' + d.desc + '</span></button>';
    }).join('');
    return {
      title: 'Build',
      html: '<div class="tabs">' + CH.BUILD_MENU.map(m => '<button class="tab' + (m.id === tab ? ' on' : '') + '" data-act="tab" data-tab="' + m.id + '">' + m.name + '</button>').join('') + '</div><div class="shop-grid">' + cards + '</div>',
      on: { tab: b => { shop.tab = b.dataset.tab; UI.refreshSheet(); }, place: b => CH.Home.startPlacement(b.dataset.type) },
    };
  }

  /* ---------------- Campaign ---------------- */
  function campaign() {
    const s = save();
    const cards = CH.REGIONS.map((r, i) => {
      const open = CH.Campaign.regionUnlocked(s, i);
      let st = 0, cleared = 0; for (let k = 0; k < 6; k++) { st += s.campaign[i + '-' + k] || 0; if (s.campaign[i + '-' + k]) cleared++; }
      UI.painters['region' + i] = cv => paintTerrain(cv, CH.View.terrain('region' + r.id, { pal: r.pal, decor: r.decor, seed: 900 + i, roads: roadsPx(CH.Campaign.stage(i, 0).tpl) }));
      const lockText = i === 0 ? '' : S.castleLevel(s) < r.castle ? 'Castle level ' + r.castle + ' required' : 'Defeat ' + CH.ENEMIES[CH.REGIONS[i - 1].boss].name;
      return '<button class="region-card' + (open ? '' : ' locked') + '" style="--accent:' + r.pal.accent + '" data-act="region" data-r="' + i + '"' + (open ? '' : ' disabled') + '>' +
        '<canvas data-paint="region' + i + '"></canvas><div class="rc-body"><span class="kicker">Region ' + (i + 1) + '</span><h3>' + r.name + '</h3><p>' + r.sub + '</p>' +
        (open ? '<div class="rc-meta">' + stars(1, 1) + st + ' / 18 · ' + cleared + ' of 6 cleared</div>' : '<div class="rc-meta">' + icon('lock') + lockText + '</div>') + '</div></button>';
    }).join('');
    return { title: 'Campaign', html: '<p class="lead">Defend the realm region by region. Build towers along the roads, deploy your troops and heroes, and protect your castle.</p><div class="region-grid">' + cards + '</div>', on: { region: b => UI.sheet('stages', +b.dataset.r) } };
  }
  function paintTerrain(cv, img) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return; cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext('2d'), sc = Math.max(cv.width / img.width, cv.height / img.height);
    c.drawImage(img, (cv.width - img.width * sc) / 2, (cv.height - img.height * sc) / 2, img.width * sc, img.height * sc);
  }

  function stages(r) {
    r = +r; const s = save(), reg = CH.REGIONS[r];
    const list = Array.from({ length: 6 }, (_, k) => {
      const st = CH.Campaign.stage(r, k), open = CH.Campaign.stageUnlocked(s, r, k), got = s.campaign[st.id] || 0;
      const types = [...new Set(st.waves.flatMap(w => w.groups.map(g => g.type)))];
      UI.painters['stage' + st.id] = cv => {
        paintTerrain(cv, CH.View.terrain('prev' + st.id, { pal: reg.pal, roads: roadsPx(st.tpl), decor: reg.decor, seed: 400 + st.gi }));
        const c = cv.getContext('2d'), sc = cv.width / (CH.CONFIG.COLS * T);
        c.save(); c.scale(sc, sc * (cv.height / cv.width) / (CH.CONFIG.ROWS / CH.CONFIG.COLS));
        CH.Art.drawBuilding(c, { type: 'castle', level: 2, tx: st.tpl.core.tx, ty: st.tpl.core.ty }, { time: 1 });
        for (const o of st.tpl.objs) CH.Art.drawBuilding(c, { type: o.type, level: 2, tx: o.tx, ty: o.ty }, { time: 1 });
        c.restore();
      };
      const rw = got ? { gold: Math.round(st.reward.gold * 0.25), wood: Math.round(st.reward.wood * 0.25), stone: Math.round(st.reward.stone * 0.25), xp: Math.round(st.reward.xp * 0.3) } : st.reward;
      return '<article class="stage-card' + (open ? '' : ' locked') + '">' +
        '<canvas data-paint="stage' + st.id + '"></canvas>' +
        '<div class="sc-body"><div class="sc-top"><span class="kicker">Stage ' + (r + 1) + '-' + (k + 1) + '</span>' + (st.obj === 'boss' ? '<span class="tag boss">' + icon('crown') + 'Boss</span>' : '') + (got ? stars(got) : '') + '</div>' +
        '<h3>' + st.name + '</h3><p class="obj">' + icon('flag' in UI.ICONS ? 'flag' : 'map') + CH.OBJECTIVES[st.obj] + '</p>' +
